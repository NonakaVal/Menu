<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary Pastelaria — Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f0d0b;
    --surface:   #161310;
    --red:       #e02d1b;
    --red-dim:   #a82010;
    --text:      #ede8e0;
    --muted:     #7a7068;
    --border:    #272320;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 600px; margin: 0 auto; padding-bottom: 140px; }

  /* ── HEADER ── */
  .header {
    text-align: center;
    padding: 56px 32px 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .header::after {
    content:''; position:absolute; top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:24px; background:var(--red);
  }
  .logo-ring {
    width:80px; height:80px; border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px;
  }
  .chef-icon { width:48px; height:48px; }
  .brand-name {
    font-family:'Playfair Display',serif;
    font-size:clamp(1.9rem,6vw,2.8rem);
    font-weight:900; letter-spacing:-0.02em; line-height:1;
  }
  .brand-name em { font-style:normal; color:var(--red); }
  .brand-sub {
    margin-top:8px;
    font-size:0.62rem; letter-spacing:0.36em; text-transform:uppercase;
    color:var(--muted);
  }
  .brand-contact {
    margin-top:16px;
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.88rem; color:var(--red); letter-spacing:0.03em;
  }
  .wa-icon { width:14px; height:14px; fill:var(--red); flex-shrink:0; }
  .brand-addr { margin-top:7px; font-size:0.68rem; color:var(--muted); letter-spacing:0.07em; }

  /* ── CATEGORY NAV ── */
  .cat-nav {
    position:sticky; top:0; z-index:40;
    background:rgba(15,13,11,0.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; padding:0 20px;
  }
  .cat-btn {
    flex:1; background:none; border:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-weight:300;
    font-size:0.65rem; letter-spacing:0.26em; text-transform:uppercase;
    color:var(--muted); padding:14px 8px 13px;
    border-bottom:1.5px solid transparent;
    transition:color .18s, border-color .18s;
  }
  .cat-btn.active { color:var(--text); border-bottom-color:var(--red); }
  .cat-btn:hover:not(.active) { color:var(--text); }

  /* ── SECTIONS ── */
  .section-label {
    display:flex; align-items:center; gap:14px;
    padding:32px 28px 16px;
  }
  .section-label h2 {
    font-size:0.56rem; letter-spacing:0.36em; text-transform:uppercase;
    color:var(--red); font-weight:400; white-space:nowrap;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ── ITEM ROW ── */
  .item {
    display:flex; align-items:baseline; gap:10px;
    padding:11px 28px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .item:last-child { border-bottom:none; }
  .item:hover { background:var(--surface); }

  .item-name {
    font-size:0.93rem; font-weight:300;
    color:var(--text); letter-spacing:.01em;
    flex:1; min-width:0;
    transition:color .15s;
  }
  .item.in-cart .item-name { color:var(--red); }

  .item-dots { flex:1; border-bottom:1px dotted var(--border); min-width:16px; position:relative; top:-3px; }

  .item-price {
    font-family:'Playfair Display',serif;
    font-size:0.9rem; color:var(--muted); white-space:nowrap;
  }
  .item.premium .item-price { color:var(--red); }

  /* Qty pill — tiny, inline after name */
  .item-qty {
    font-size:0.68rem; color:var(--muted);
    min-width:14px; text-align:right;
    font-variant-numeric:tabular-nums;
    transition:color .15s;
  }
  .item.in-cart .item-qty { color:var(--red); }

  /* ── CART BAR ── */
  .cart-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:600px;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:14px 24px 20px;
    z-index:100;
    transition:transform .28s ease, opacity .28s ease;
  }
  .cart-bar.hidden {
    transform:translateX(-50%) translateY(110%);
    opacity:0; pointer-events:none;
  }

  /* Summary line */
  .cart-top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .cart-info { font-size:0.8rem; color:var(--muted); }
  .cart-info strong { color:var(--text); font-weight:400; }

  /* Clear link */
  .cart-clear {
    font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); background:none; border:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; padding:0;
    transition:color .15s;
  }
  .cart-clear:hover { color:var(--text); }

  /* Delivery question — inline, revealed on send click */
  .delivery-question {
    overflow:hidden; max-height:0; opacity:0;
    transition:max-height .28s ease, opacity .25s ease, margin .25s ease;
    margin-bottom:0;
  }
  .delivery-question.open { max-height:100px; opacity:1; margin-bottom:12px; }

  .dq-label {
    font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px; display:block;
  }
  .dq-options {
    display:flex; gap:8px;
  }
  .dq-btn {
    flex:1; background:none; border:1px solid var(--border);
    color:var(--muted); border-radius:2px;
    font-family:'DM Sans',sans-serif; font-size:0.75rem;
    letter-spacing:0.1em; text-transform:uppercase;
    padding:8px 0; cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .dq-btn.chosen { border-color:var(--red); color:var(--text); background:rgba(224,45,27,0.06); }
  .dq-btn:hover:not(.chosen) { border-color:var(--muted); color:var(--text); }

  /* Address input */
  .addr-wrap {
    overflow:hidden; max-height:0; opacity:0;
    transition:max-height .24s ease, opacity .22s ease, margin .22s ease;
    margin-top:0;
  }
  .addr-wrap.open { max-height:52px; opacity:1; margin-top:8px; }
  .addr-input {
    width:100%; background:var(--bg);
    border:1px solid var(--border); border-radius:2px;
    color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:0.82rem; font-weight:300;
    padding:9px 12px; outline:none;
    transition:border-color .18s;
  }
  .addr-input::placeholder { color:var(--muted); }
  .addr-input:focus { border-color:var(--red); }

  /* Send button */
  .send-row { display:flex; gap:8px; }
  .send-btn {
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--red); color:#fff;
    border:none; border-radius:2px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.75rem;
    font-weight:400; letter-spacing:0.14em; text-transform:uppercase;
    padding:12px 0;
    transition:background .18s;
    text-decoration:none;
  }
  .send-btn:hover { background:var(--red-dim); }
  .send-btn svg { width:14px; height:14px; fill:#fff; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .header   { animation:fadeUp .6s ease both; }
  .cat-nav  { animation:fadeUp .6s .08s ease both; }
  .fade-in  { animation:fadeUp .2s ease both; }

  /* ── FOOTER ── */
  .footer { text-align:center; padding:44px 28px 28px; border-top:1px solid var(--border); }
  .footer-line { width:1px; height:24px; background:var(--red); margin:0 auto 18px; }
  .footer p { font-size:0.62rem; color:var(--muted); letter-spacing:0.18em; text-transform:uppercase; }

  @media(max-width:480px){
    .item { padding:10px 18px; }
    .section-label { padding:26px 18px 14px; }
    .header { padding:48px 18px 34px; }
    .cart-bar { padding:12px 16px 18px; }
    .cat-nav { padding:0 6px; }
  }
</style>
</head>

<script>
const WA = '5515998304344';

const menu = {
  pasteis:{

      {name:"Queijo",        desc:"Mussarela derretida",               price:8},

      {name:"Brigadeiro c/ Morango", desc:"Brigadeiro com morango",price:12},
      {name:"Banana c/ Canela",      desc:"Banana caramelizada",   price:12},
      {name:"Nutella",               desc:"Creme de avelã",        price:15,premium:true},

  },

    "Salgados":[
      {name:"Coxinha de Frango",          desc:"Massa tradicional recheada", price:7},
      {name:"Coxinha de Costela",         desc:"Recheada com costela",       price:9,premium:true},
      {name:"Risoles de Presunto/Queijo", desc:"Massa leve",                 price:7},
      {name:"Risoles de Carne",           desc:"Carne moída temperada",      price:7},
      {name:"Bolinha de Queijo",          desc:"Queijo coalho empanado",     price:8},
      {name:"Kibe",                       desc:"Trigo com carne e hortelã",  price:7},
      {name:"Kibe c/ Requeijão",          desc:"Kibe recheado",             price:8},
      {name:"Esfiha de Carne",            desc:"Aberta com carne e tomate",  price:6},
      {name:"Esfiha de Frango",           desc:"Aberta com frango",          price:6},
      {name:"Enroladinho de Salsicha",    desc:"Massa folhada",             price:6},
      {name:"Folhado de Calabresa",       desc:"Calabresa e queijo",         price:8},
      {name:"Pão de Queijo",              desc:"Tradicional mineiro",        price:4},

    ]
  },
  bebidas:{
    "Bebidas":[
      {name:"Refrigerante Lata",     desc:"Coca, Guaraná, Sprite 350ml", price:6},
      {name:"Refrigerante 600ml",    desc:"Coca ou Guaraná",             price:9},
      {name:"Água sem Gás",          desc:"500ml",                       price:4},
      {name:"Água com Gás",          desc:"500ml",                       price:5},
      {name:"Suco Natural Laranja",  desc:"Copo 300ml",                  price:9},
      {name:"Suco Natural Maracujá", desc:"Copo 300ml",                  price:9},
      {name:"Suco Natural Limão",    desc:"Copo 300ml com hortelã",      price:8},
      {name:"Café Expresso",         desc:"Café forte",                  price:5},
      {name:"Café com Leite",        desc:"",                            price:6},
      {name:"Cappuccino",            desc:"Espresso com leite",          price:8},
      {name:"Chá Gelado",            desc:"Limão ou pêssego, 500ml",     price:7},
      {name:"Caldo de Cana",         desc:"Copo 300ml",                  price:6},
      {name:"Água de Coco",          desc:"Copo 300ml",                  price:7},
    ]
  }
};

// State
const cart     = new Map(); // id → {name, price, qty}
let dqShown    = false;     // delivery question revealed
let deliveryChoice = null;  // null | true | false

const fmt  = n  => 'R$ ' + n.toFixed(2).replace('.',',');
const toId = s  => s.replace(/[^a-z0-9]/gi,'_');

// ── RENDER MENU ──────────────────────────────────────────────────────
function renderMenu(cat) {
  const wrap = document.getElementById('menu-wrap');
  let html = '';
  Object.entries(menu[cat]).forEach(([sec, items]) => {
    html += `<div class="section-label"><h2>${sec}</h2></div>`;
    items.forEach(item => {
      const id  = toId(item.name);
      const qty = cart.has(id) ? cart.get(id).qty : 0;
      const inCart  = qty > 0 ? ' in-cart' : '';
      const premium = item.premium ? ' premium' : '';
      html += `
        <div class="item${inCart}${premium} fade-in" id="row-${id}"
             onclick="tap('${id}','${item.name.replace(/'/g,"\\'")}',${item.price})">
          <span class="item-name">${item.name}</span>
          <span class="item-qty" id="qty-${id}">${qty > 0 ? '×'+qty : ''}</span>
          <span class="item-dots"></span>
          <span class="item-price">${fmt(item.price)}</span>
        </div>`;
    });
  });
  wrap.innerHTML = html;
}

// ── TAP — add / increment / remove at 9 ──────────────────────────────
function tap(id, name, price) {
  if (cart.has(id)) {
    const e = cart.get(id);
    if (e.qty >= 9) cart.delete(id);
    else            e.qty++;
  } else {
    cart.set(id, {name, price, qty:1});
  }
  const qty   = cart.has(id) ? cart.get(id).qty : 0;
  const row   = document.getElementById('row-'+id);
  const badge = document.getElementById('qty-'+id);
  if (badge) badge.textContent = qty > 0 ? '×'+qty : '';
  if (row)   row.classList.toggle('in-cart', qty > 0);
  refreshBar();
}

// Long-press to remove immediately
(function longPress(){
  let timer;
  document.addEventListener('pointerdown', e => {
    const row = e.target.closest('.item');
    if (!row) return;
    timer = setTimeout(() => {
      const id = row.id.replace('row-','');
      if (cart.has(id)) {
        cart.delete(id);
        const badge = document.getElementById('qty-'+id);
        if (badge) badge.textContent = '';
        row.classList.remove('in-cart');
        refreshBar();
      }
    }, 600);
  });
  document.addEventListener('pointerup',    () => clearTimeout(timer));
  document.addEventListener('pointermove',  () => clearTimeout(timer));
})();

// ── CART BAR ─────────────────────────────────────────────────────────
function refreshBar() {
  const bar  = document.getElementById('cart-bar');
  const info = document.getElementById('cart-info');
  if (!cart.size) {
    bar.classList.add('hidden');
    closeDQ();
    return;
  }
  bar.classList.remove('hidden');
  let total=0, count=0;
  cart.forEach(e => { total += e.price*e.qty; count += e.qty; });
  info.innerHTML = `<strong>${count} ${count===1?'item':'itens'}</strong> &middot; ${fmt(total)}`;
}

function clearCart() {
  cart.clear();
  closeDQ();
  // reset all visible badges & states
  document.querySelectorAll('.item.in-cart').forEach(r => {
    r.classList.remove('in-cart');
    const id = r.id.replace('row-','');
    const b  = document.getElementById('qty-'+id);
    if (b) b.textContent = '';
  });
  document.getElementById('cart-bar').classList.add('hidden');
}

// ── DELIVERY QUESTION ────────────────────────────────────────────────
function openDQ() {
  dqShown = true;
  document.getElementById('dq').classList.add('open');
}
function closeDQ() {
  dqShown = false;
  deliveryChoice = null;
  document.getElementById('dq').classList.remove('open');
  document.getElementById('addr-wrap').classList.remove('open');
  document.getElementById('dq-yes').classList.remove('chosen');
  document.getElementById('dq-no').classList.remove('chosen');
  document.getElementById('addr-input').value = '';
}

function chooseDelivery(yes) {
  deliveryChoice = yes;
  document.getElementById('dq-yes').classList.toggle('chosen',  yes);
  document.getElementById('dq-no').classList.toggle('chosen',  !yes);
  document.getElementById('addr-wrap').classList.toggle('open',  yes);
  if (yes) setTimeout(() => document.getElementById('addr-input').focus(), 260);
}

// ── HANDLE SEND ──────────────────────────────────────────────────────
function handleSend() {
  if (!cart.size) return;

  // Step 1: show delivery question if not yet shown
  if (!dqShown) { openDQ(); return; }

  // Step 2: need a choice
  if (deliveryChoice === null) return;

  // Step 3: if delivery chosen, need address
  if (deliveryChoice) {
    const addr = document.getElementById('addr-input').value.trim();
    if (!addr) { document.getElementById('addr-input').focus(); return; }
  }

  // Build + send
  let lines = ['🥟 *Pedido — Mary Pastelaria*', ''];
  let total = 0;
  cart.forEach(e => {
    const sub = e.price * e.qty;
    total += sub;
    lines.push(`• ${e.qty}x ${e.name} — ${fmt(sub)}`);
  });
  lines.push('', `*Total: ${fmt(total)}*`, '');
  if (deliveryChoice) {
    const addr = document.getElementById('addr-input').value.trim();
    lines.push(`📍 *Entrega:* ${addr}`);
  } else {
    lines.push('🏠 *Retirada no local*');
  }

  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
}

// ── CATEGORY ─────────────────────────────────────────────────────────
function selectCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu(cat);
}

renderMenu('pasteis');
</script>
