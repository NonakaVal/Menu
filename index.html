<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mary Pastelaria — Cardápio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f3f0;
      --surface: #ffffff;
      --primary: #E61A25;
      --primary-dark: #B8141E;
      --primary-soft: rgba(230, 26, 37, 0.07);
      --primary-muted: #c0383e;
      --primary-muted-soft: rgba(192, 56, 62, 0.09);
      --text: #1E1B18;
      --text-light: #5a524a;
      --border: #ddd6cc;
      --nav-bg: rgba(245, 243, 240, 0.97);
      --hero-from: #6b0d11;
      --hero-to: #b5161c;
      --bg-solid: #f5f3f0;
    }

    :root.dark {
      --bg: #12100E;
      --surface: #1a1816;
      --primary: #E61A25;
      --primary-dark: #B8141E;
      --primary-soft: rgba(230, 26, 37, 0.10);
      --primary-muted: #b8484c;
      --primary-muted-soft: rgba(184, 72, 76, 0.11);
      --text: #f0ebe4;
      --text-light: #9a9088;
      --border: #2e2922;
      --nav-bg: rgba(18, 16, 14, 0.97);
      --hero-from: #2a0406;
      --hero-to: #7a0d12;
      --bg-solid: #12100E;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg-solid);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
      line-height: 1.3;
    }

    /* Hero simplificado */
    .hero {
      background: linear-gradient(180deg, var(--hero-from) 0%, var(--hero-to) 45%, var(--bg-solid) 95%);
      padding-bottom: 16px;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 8px;
    }

    .brand-logo {
      display: block;
      width: min(90vw, 500px);
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    .hero-info {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .brand-contact {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .brand-addr {
      font-size: 0.55rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .page {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 100px;
    }

    /* Topbar redesenhada — minimalista, angular */
    .topbar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 560px;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .topbar-left {
      pointer-events: all;
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.52);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 6px;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .topbar-mode {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      color: white;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: none;
      border: none;
      border-right: 1px solid rgba(255,255,255,0.13);
      cursor: pointer;
      white-space: nowrap;
    }

    .topbar-mode-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    body.order-mode .topbar-mode-dot {
      background: #4ade80;
    }

    .topbar-back {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 7px 11px;
      color: rgba(255,255,255,0.65);
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
    }

    body.order-mode .topbar-mode {
      display: none;
    }

    body.order-mode .topbar-back {
      display: flex;
    }

    .topbar-theme {
      pointer-events: all;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.52);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 6px;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    /* Navegação compacta */
    .cat-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 12px;
      gap: 4px;
    }

    .cat-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 4px 10px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-light);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Labels de seção compactas */
    .section-label {
      display: flex;
      align-items: center;
      padding: 12px 16px 4px;
    }

    .section-label h2 {
      font-size: 0.55rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      margin-left: 12px;
    }

    /* Grupo de itens */
    .item-group {
      margin: 0 12px 8px;
      background: var(--surface);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* Item redesenhado - mais compacto e legível */
    .item {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-main {
      display: flex;
      align-items: center;
      min-height: 36px;
    }

    /* Controles mais compactos */
    .item-controls {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .ctrl-btn {
      width: 32px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ctrl-btn:active {
      background: var(--primary-soft);
    }

    .ctrl-count {
      width: 24px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary-muted);
      border-left: 1px solid var(--border);
    }

    .ctrl-count.zero {
      color: var(--border);
    }

    /* Área do item principal - otimizada para wrap */
    .item-left {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px 5px 10px;
      min-width: 0;
    }

    .item-marker {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .item.in-cart .item-marker {
      background: var(--primary-muted);
    }

    .item-name {
      font-size: 0.77rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
      line-height: 1.3;
      flex: 1;
    }

    /* Preço e badge mais integrados */
    .item-price-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .item-qty-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary-muted);
      white-space: nowrap;
    }

    .item-price {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-light);
      white-space: nowrap;
    }

    .item.premium .item-price {
      color: var(--primary-muted);
    }

    /* Ícone de observação simplificado */
    .item-obs-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      margin-right: 2px;
      cursor: pointer;
      color: var(--text-light);
      opacity: 0.4;
      flex-shrink: 0;
    }

    .item-obs-icon.active {
      opacity: 1;
      color: var(--primary-muted);
    }

    .item-obs-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
    }

    /* Campo de observação */
    .item-obs-field {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.2s ease, opacity 0.15s ease;
      padding: 0 16px 0 48px;
    }

    .item-obs-field.open {
      max-height: 80px;
      opacity: 1;
      padding-bottom: 12px;
    }

    .item-obs-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px 10px;
      font-size: 0.7rem;
      color: var(--text);
      resize: none;
    }

    /* Barra de carrinho simplificada */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      border-radius: 0;
      padding: 12px 20px 24px;
      z-index: 100;
      transition: transform 0.25s ease;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }

    .cart-bar.hidden {
      transform: translateX(-50%) translateY(100%);
    }

    .cart-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-info {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .cart-info strong {
      color: var(--text);
    }

    .review-btn {
      background: var(--primary);
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Modal de resumo simplificado */
    .summary-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 149;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .summary-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .summary-sheet {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: calc(100% - 32px);
      max-width: 480px;
      background: var(--surface);
      border-radius: 6px;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .summary-sheet.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .summary-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .summary-list {
      overflow-y: auto;
      padding: 8px 0;
      flex: 1;
    }

    .summary-row {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .summary-row-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-row-name {
      flex: 1;
      font-size: 0.8rem;
      font-weight: 500;
      word-break: break-word;
    }

    .summary-row-qty {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary-muted);
    }

    .summary-row-price {
      font-family: 'Playfair Display', serif;
      font-size: 0.8rem;
      min-width: 60px;
      text-align: right;
    }

    .summary-row-obs {
      font-size: 0.6rem;
      color: var(--text-light);
      font-style: italic;
      margin-top: 6px;
      padding-left: 8px;
      border-left: 2px solid var(--primary-muted);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--primary-soft);
    }

    .summary-total-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-total-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Toggle delivery compacto */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      cursor: pointer;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.6rem;
      font-weight: 600;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-light);
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .toggle-track {
      background: var(--primary);
    }

    input:checked + .toggle-track::after {
      transform: translateX(20px);
      background: white;
    }

    .summary-addr-wrap {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
    }

    .summary-addr-wrap.open {
      max-height: 80px;
      opacity: 1;
    }

    .addr-input {
      width: calc(100% - 40px);
      margin: 0 20px 12px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
    }

    .send-btn {
      margin: 8px 20px 20px;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* WA bar modo leitura */
    .wa-read-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      border-radius: 0;
      padding: 16px 20px 24px;
      z-index: 100;
    }

    body:not(.order-mode) .wa-read-bar {
      display: block;
    }

    .wa-read-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: #25D366;
      border-radius: 4px;
      color: white;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Info card — tooltip de dica + info de entrega */
    .info-card {
      margin: 6px 12px 2px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary-muted);
      border-radius: 0 3px 3px 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .info-card-icon {
      color: var(--primary-muted);
      opacity: 0.7;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-card-icon svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
    }

    .info-card-text {
      font-size: 0.62rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    .info-card-text strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Modo leitura: mostra só info de entrega */
    .info-card-obs { display: none; }
    .info-card-sep { display: none; }
    body.order-mode .info-card-obs { display: inline; }
    body.order-mode .info-card-sep { display: inline; }
    .footer {
      text-align: center;
      padding: 32px 16px 20px;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 0.55rem;
      color: var(--text-light);
      letter-spacing: 1px;
      opacity: 0.6;
    }

    /* Esconde elementos quando não está em modo pedido */
    body:not(.order-mode) .item-controls,
    body:not(.order-mode) .item-obs-icon,
    body:not(.order-mode) .item-obs-field {
      display: none;
    }

    body:not(.order-mode) .item-left {
      padding: 5px 14px 5px 14px;
    }

    body:not(.order-mode) .item-main {
      min-height: 28px;
    }

    body:not(.order-mode) .item-name {
      font-size: 0.75rem;
      font-weight: 400;
    }

    body:not(.order-mode) .item-price {
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
    }

    body:not(.order-mode) .item-marker {
      display: none;
    }

    body:not(.order-mode) .item-group {
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <button class="topbar-mode" onclick="toggleMode()" id="mode-btn">
        <span class="topbar-mode-dot"></span>
        <span id="mode-label">Ativar opções de pedido</span>
      </button>
      <button class="topbar-back" onclick="toggleMode()">
        <svg width="9" height="9" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar ao cardápio
      </button>
    </div>
    <button class="topbar-theme" onclick="toggleTheme()">
      <svg width="14" height="14" viewBox="0 0 24 24" class="icon-sun" style="stroke:white; fill:none; stroke-width:1.8">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
        <line x1="19.78" y1="4.22" x2="17.66" y2="6.34"/><line x1="6.34" y1="17.66" x2="4.22" y2="19.78"/>
      </svg>
      <svg width="14" height="14" viewBox="0 0 24 24" class="icon-moon" style="stroke:white; fill:none; stroke-width:1.8">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

  <div class="hero">
    <div class="hero-content">
      <img class="brand-logo" src="Assets/logo-banner-nbg.png" alt="Mary Pastelaria">
      <div class="hero-info">
        <a class="brand-contact" href="https://wa.me/5515996026387" target="_blank">

    <a class="wa-read-btn" href="https://wa.me/5515996026387" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12.004 0C5.373 0 0 5.373 0 12.004c0 2.114.554 4.1 1.522 5.827L0 24l6.351-1.498A11.957 11.957 0 0012.004 24C18.63 24 24 18.627 24 12.004 24 5.373 18.63 0 12.004 0zm0 21.818a9.812 9.812 0 01-5.001-1.368l-.36-.214-3.72.876.916-3.617-.235-.372a9.82 9.82 0 01-1.507-5.119c0-5.425 4.412-9.837 9.837-9.837 5.426 0 9.837 4.412 9.837 9.837S17.43 21.818 12.004 21.818z"/></svg>

    <label class="toggle-row">
      <span class="toggle-label">
        <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Delivery (+R$ 3,00)
      </span>
      <span class="toggle-switch">
        <input type="checkbox" id="delivery-toggle" onchange="onToggleDelivery(this.checked)">
        <span class="toggle-track"></span>
      </span>
    </label>
    <div class="summary-addr-wrap" id="summary-addr-wrap">
      <input class="addr-input" id="addr-input" placeholder="Endereço completo para entrega">
    </div>
    <button class="send-btn" onclick="handleSend()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12.004 0C5.373 0 0 5.373 0 12.004c0 2.114.554 4.1 1.522 5.827L0 24l6.351-1.498A11.957 11.957 0 0012.004 24C18.63 24 24 18.627 24 12.004 24 5.373 18.63 0 12.004 0zm0 21.818a9.812 9.812 0 01-5.001-1.368l-.36-.214-3.72.876.916-3.617-.235-.372a9.82 9.82 0 01-1.507-5.119c0-5.425 4.412-9.837 9.837-9.837 5.426 0 9.837 4.412 9.837 9.837S17.43 21.818 12.004 21.818z"/></svg>
      Enviar pedido
    </button>
  </div>

  <script>
    const WA = '5515998304344';
    const DELIVERY_FEE = 3;

    const menu = {
      pasteis: {
        "Simples": [
          { name:"Carne", price:8 }, { name:"Queijo", price:8 },
          { name:"Frango", price:8 }, { name:"Pizza", price:8 }
        ],
        "Combinados": [
          { name:"Carne c/ Queijo", price:10 }, { name:"Frango c/ Queijo", price:10 },
          { name:"Frango c/ Catupiry", price:10 }, { name:"Calabresa c/ Queijo", price:10 },
          { name:"Portuguesa", price:10 }
        ],
        "Doces": [
          { name:"Brigadeiro", price:12 }, { name:"Prestígio", price:12 },
          { name:"Doce de Leite", price:12 }, { name:"Brigadeiro c/ Morango", price:12 },
          { name:"Banana c/ Canela", price:12 }, { name:"Nutella", price:15, premium:true },
          { name:"Romeu e Julieta", price:12 }
        ]
      },
      salgados: {
        "Especiais": [
          { name:"Costela", price:15, premium:true }, { name:"Costela c/ Queijo", price:15, premium:true },
          { name:"Bacon", price:15, premium:true }, { name:"X-Tudo", price:15, premium:true },
          { name:"Strogonoff de Frango", price:15, premium:true }, { name:"Carne Seca", price:15, premium:true },
          { name:"Pernil", price:15, premium:true }, { name:"Palmito", price:15, premium:true }
        ]
      },
      bebidas: {
        "Bebidas": [
          { name:"Refrigerante Lata", price:6 }, { name:"Refrigerante 600ml", price:9 },
          { name:"Água sem Gás", price:4 }, { name:"Água com Gás", price:5 },
          { name:"Suco Natural Laranja", price:9 }, { name:"Suco Natural Maracujá", price:9 },
          { name:"Suco Natural Limão", price:8 }, { name:"Café Expresso", price:5 },
          { name:"Café com Leite", price:6 }, { name:"Cappuccino", price:8 },
          { name:"Chá Gelado", price:7 }, { name:"Caldo de Cana", price:6 },
          { name:"Água de Coco", price:7 }
        ]
      }
    };

    const cart = new Map();
    let wantsDelivery = false;
    let orderMode = false;
    let currentCat = 'pasteis';

    const fmt = n => 'R$ ' + n.toFixed(2).replace('.', ',');
    const toId = s => s.replace(/[^a-z0-9]/gi, '_');

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    (function() {
      // Sempre inicia no modo escuro
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme', 'dark');
    })();

    function renderMenu(cat) {
      const wrap = document.getElementById('menu-wrap');
      let html = '';
      
      Object.entries(menu[cat]).forEach(([section, items]) => {
        html += `<div class="section-label"><h2>${section}</h2></div>`;
        html += `<div class="item-group">`;
        
        items.forEach(item => {
          const id = toId(item.name);
          const cartItem = cart.get(id);
          const qty = cartItem ? cartItem.qty : 0;
          const obs = cartItem ? cartItem.obs || '' : '';
          
          html += `
            <div class="item${qty > 0 ? ' in-cart' : ''}${item.premium ? ' premium' : ''}" id="row-${id}">
              <div class="item-main">
                <div class="item-controls">
                  <button class="ctrl-btn" onclick="dec('${id}')" style="border-right:1px solid var(--border)">−</button>
                  <span class="ctrl-count${qty === 0 ? ' zero' : ''}" id="qty-${id}">${qty}</span>
                </div>
                <div class="item-left">
                  <span class="item-marker"></span>
                  <span class="item-name">${item.name}</span>
                  <div class="item-price-wrap">
                    ${qty > 0 ? `<span class="item-qty-badge" id="badge-${id}">${qty}×</span>` : ''}
                    <span class="item-price">${fmt(item.price)}</span>
                    <span class="item-obs-icon ${cartItem?.obs ? 'active' : ''}" onclick="toggleItemObs('${id}')">
                      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </span>
                  </div>
                </div>
                <div class="item-controls">
                  <button class="ctrl-btn" onclick="inc('${id}','${item.name}',${item.price})">+</button>
                </div>
              </div>
              <div class="item-obs-field ${cartItem?.obs ? 'open' : ''}" id="obs-field-${id}">
                <textarea class="item-obs-input" id="obs-${id}" 
                  placeholder="Observação (opcional)"
                  onchange="updateItemObs('${id}', this.value)"
                  rows="1">${obs}</textarea>
              </div>
            </div>
          `;
        });
        
        html += `</div>`;
      });
      
      wrap.innerHTML = html;
    }

    function inc(id, name, price) {
      if (!orderMode) return;
      if (cart.has(id)) {
        cart.get(id).qty++;
      } else {
        cart.set(id, { name, price, qty: 1 });
      }
      sync(id);
    }

    function dec(id) {
      if (!orderMode || !cart.has(id)) return;
      const item = cart.get(id);
      if (--item.qty <= 0) {
        cart.delete(id);
      }
      sync(id);
    }

    function toggleItemObs(id) {
      if (!orderMode) return;
      document.getElementById('obs-field-' + id)?.classList.toggle('open');
    }

    function updateItemObs(id, value) {
      if (!orderMode || !cart.has(id)) return;
      const item = cart.get(id);
      item.obs = value.trim() || undefined;
      
      const icon = document.querySelector(`#row-${id} .item-obs-icon`);
      if (item.obs) {
        icon?.classList.add('active');
      } else {
        icon?.classList.remove('active');
      }
    }

    function sync(id) {
      const qty = cart.has(id) ? cart.get(id).qty : 0;
      const row = document.getElementById('row-' + id);
      const ctr = document.getElementById('qty-' + id);
      const badge = document.getElementById('badge-' + id);
      
      if (ctr) {
        ctr.textContent = qty;
        ctr.classList.toggle('zero', qty === 0);
      }
      
      if (badge) {
        if (qty > 0) {
          badge.textContent = qty + '×';
          badge.style.display = 'inline';
        } else {
          badge.style.display = 'none';
        }
      }
      
      if (row) {
        row.classList.toggle('in-cart', qty > 0);
      }
      
      refreshBar();
    }

    function refreshBar() {
      const bar = document.getElementById('cart-bar');
      if (!cart.size || !orderMode) {
        bar.classList.add('hidden');
        return;
      }
      
      bar.classList.remove('hidden');
      let total = 0, count = 0;
      cart.forEach(e => { total += e.price * e.qty; count += e.qty; });
      document.getElementById('cart-info').innerHTML = 
        `<strong>${count} ${count === 1 ? 'item' : 'itens'}</strong> · ${fmt(total)}`;
    }

    function calculateSubtotal() {
      let total = 0;
      cart.forEach(e => total += e.price * e.qty);
      return total;
    }

    function onToggleDelivery(v) {
      wantsDelivery = v;
      document.getElementById('summary-addr-wrap').classList.toggle('open', v);
      updateSummaryTotal();
    }

    function updateSummaryTotal() {
      const subtotal = calculateSubtotal();
      const total = subtotal + (wantsDelivery ? DELIVERY_FEE : 0);
      document.getElementById('summary-total-value').textContent = fmt(total);
    }

    function openSummary() {
      const list = document.getElementById('summary-list');
      let rows = '';
      
      cart.forEach(e => {
        rows += `
          <div class="summary-row">
            <div class="summary-row-main">
              <span class="summary-row-name">${e.name}</span>
              <span class="summary-row-qty">${e.qty}×</span>
              <span class="summary-row-price">${fmt(e.price * e.qty)}</span>
            </div>
            ${e.obs ? `<div class="summary-row-obs">${e.obs}</div>` : ''}
          </div>
        `;
      });
      
      list.innerHTML = rows;
      updateSummaryTotal();
      document.getElementById('summary-sheet').classList.add('open');
      document.getElementById('summary-overlay').classList.add('open');
    }

    function closeSummary() {
      document.getElementById('summary-sheet').classList.remove('open');
      document.getElementById('summary-overlay').classList.remove('open');
    }

    function handleSend() {
      if (!cart.size) return;
      if (wantsDelivery && !document.getElementById('addr-input').value.trim()) {
        document.getElementById('addr-input').focus();
        return;
      }
      
      const subtotal = calculateSubtotal();
      const total = subtotal + (wantsDelivery ? DELIVERY_FEE : 0);
      const now = new Date();
      
      let lines = [
        `*Mary Pastelaria* · ${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`,
        ``
      ];
      
      cart.forEach(e => {
        lines.push(`${e.qty}× ${e.name} — ${fmt(e.price * e.qty)}`);
        if (e.obs) lines.push(`  ↳ ${e.obs}`);
      });
      
      lines.push('');
      if (wantsDelivery) lines.push(`Entrega: +${fmt(DELIVERY_FEE)}`);
      lines.push(`*Total: ${fmt(total)}*`);
      lines.push('');
      lines.push(wantsDelivery 
        ? `📍 ${document.getElementById('addr-input').value.trim()}`
        : `🏠 Retirada no local`);
      
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
    }

    function selectCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = cat;
      renderMenu(cat);
    }

    function toggleMode() {
      orderMode = !orderMode;
      document.body.classList.toggle('order-mode', orderMode);
      document.getElementById('mode-label').textContent = orderMode ? 'Ativar opções de pedido' : 'Ativar opções de pedido';
      
      if (!orderMode) {
        cart.clear();
        wantsDelivery = false;
        document.getElementById('cart-bar').classList.add('hidden');
        document.getElementById('delivery-toggle').checked = false;
        document.getElementById('summary-addr-wrap').classList.remove('open');
        document.getElementById('addr-input').value = '';
        closeSummary();
      }
      
      renderMenu(currentCat);
    }

    renderMenu('pasteis');
    // Inicia em modo leitura (não chama toggleMode)
  </script>
</body>
