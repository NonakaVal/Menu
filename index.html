<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary Pastelaria — Cardápio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Forum&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
<style>
  :root {
    --bg:        #ffffff;
    --surface:   #f6f2ed;
    --red:       #a0171c;
    --red-faint: rgba(0, 0, 0, 0.07);
    --text:      #1f1d1d;
    --muted:     #7a6e62;
    --border:    #ebe3da;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Forum', serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .page { width:100%; max-width:600px; margin:0 auto; padding-bottom:160px; }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(to bottom, #bb1118 0%, #dd1f28 39%, #f0ddd6 90%, #fff 100%);
  }
  .hero-content {
    display: flex; flex-direction: column; align-items: center;
    padding: 44px 28px 80px;
  }
  .brand-logo {
    display: block;
    width: clamp(290px, 72vw, 440px);
    height: auto;
    filter: drop-shadow(0 3px 14px rgba(0,0,0,0.42));
  }

  /* ── NAV WRAPPER — sticky ── */
  .cat-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }



  /* icon cards — collapse when sticky */
  .cat-cards {
    display: flex;
    padding: 8px 12px 0;
    gap: 6px;
    max-height: 72px;
    overflow: hidden;
    opacity: 1;
    transition: max-height .2s ease, opacity .18s ease, padding .2s ease;
  }
  .cat-nav.scrolled .cat-cards {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
  }

  .cat-card {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 7px 4px 8px;
    border-radius: 10px;
    background: none; border: none; cursor: pointer;
    transition: background .15s;
  }
  .cat-card:hover  { background: var(--surface); }
  .cat-card.active { background: var(--surface); }

  .cat-icon {
    width: 17px; height: 17px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    background: var(--surface);
  }
  .cat-card.active .cat-icon { background: var(--border); }
  .cat-icon svg { width: 16px; height: 16px; fill: var(--muted); stroke: none; }
  .cat-card.active .cat-icon svg { fill: var(--red); }

  /* tab bar (always visible, thinner) */
  .cat-tabs {
    display: flex;
    padding: 0 6px;
  }
  .cat-tab {
    flex: 1; background: none; border: none; cursor: pointer;
    font-family: 'Forum', serif; font-weight: 900;
    font-size: 1rem; letter-spacing: 0.1em;
    color: #ff0011d2; padding: 5px 4px 10px;
   
    transition: color .15s, border-color .15s;
  }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--red); }
  .cat-tab:hover:not(.active) { color: var(--text); }

  /* ── SECTION LABEL ── */
  .section-label {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 20px 7px;
  }
  .section-label h2 {
    font-size: 0.58rem; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--red); white-space: nowrap;
  }
  .section-label::after { content:''; flex:1; height:1px; background: var(--border); }

  /* ── ITEM ROW ── */
  .item {
    display: flex; align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    min-height: 48px;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--surface); }

  .item-name {
    flex: 1; min-width: 0;
    font-size: 0.98rem; font-weight: 500;
    color: var(--text); line-height: 1.2;
  }
  .item.in-cart .item-name { color: var(--red); }

  .item-right {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; margin-left: 10px;
  }

  .item-price {
    font-size: 0.78rem; font-weight: 500;
    color: var(--muted); white-space: nowrap;
    min-width: 50px; text-align: right;
  }
  .item.premium  .item-price { color: var(--red); }
  .item.in-cart  .item-price { color: var(--red); }

  /* add button */
  .btn-add-initial {
    width: 22px; height: 22px; border-radius: 50%;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; font-weight: 300; line-height: 1;
    flex-shrink: 0;
  }
  .btn-add-initial:hover { border-color: var(--red); color: var(--red); }
  .item.in-cart .btn-add-initial { display: none; }

  /* stepper */
  .item-stepper { display: none; align-items: center; gap: 5px; }
  .item.in-cart .item-stepper { display: flex; }

  .item-qty {
    font-size: 0.75rem; font-weight: 600; color: var(--red);
    min-width: 14px; text-align: center;
  }

  .btn-stepper {
    width: 22px; height: 22px; border-radius: 50%;
    cursor: pointer; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; line-height: 1; flex-shrink: 0;
  }
  .btn-stepper.plus  { color: var(--red);   border: 1px solid rgba(160,23,28,0.3); }
  .btn-stepper.plus:hover  { border-color: var(--red); }
  .btn-stepper.minus { color: var(--muted); border: 1px solid var(--border); }
  .btn-stepper.minus:hover { color: var(--red); border-color: var(--red); }

  /* ── CART BAR ── */
  .cart-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 600px;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 14px 20px 24px; z-index: 100;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    transition: transform .24s ease, opacity .24s ease;
  }
  .cart-bar.hidden { transform: translateX(-50%) translateY(110%); opacity:0; pointer-events:none; }

  .cart-top { margin-bottom: 12px; }
  .cart-info { font-size: 0.82rem; font-weight: 500; color: var(--muted); }
  .cart-info strong { color: var(--text); font-weight: 700; }

  .delivery-question { overflow:hidden; max-height:0; opacity:0; transition: max-height .25s ease, opacity .22s ease, margin .22s ease; }
  .delivery-question.open { max-height:120px; opacity:1; margin-bottom:12px; }

  .dq-label {
    display: block; font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .dq-options { display: flex; gap: 8px; }
  .dq-btn {
    flex:1; background:none; border:1px solid var(--border);
    color:var(--muted); border-radius:4px;
    font-family:'Forum',serif; font-size:0.63rem;
    font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    padding:9px 0; cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .dq-btn.chosen { border-color:var(--red); color:var(--text); background:var(--red-faint); }
  .dq-btn:hover:not(.chosen) { border-color:var(--muted); color:var(--text); }

  .addr-wrap { overflow:hidden; max-height:0; opacity:0; transition: max-height .2s ease, opacity .2s ease, margin .2s ease; }
  .addr-wrap.open { max-height:52px; opacity:1; margin-top:8px; }
  .addr-input {
    width:100%; background:var(--surface);
    border:1px solid var(--border); border-radius:4px;
    color:var(--text); font-family:'Forum',serif;
    font-size:0.78rem; font-weight:400;
    padding:9px 12px; outline:none;
  }
  .addr-input::placeholder { color:var(--muted); }
  .addr-input:focus { border-color:var(--red); }

  .send-btn {
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--red); color:#fff; border:none; border-radius:4px; cursor:pointer;
    font-family:'Forum',serif; font-size:0.67rem;
    font-weight:700; letter-spacing:0.16em; text-transform:uppercase;
    padding:13px 0; transition:background .15s;
  }
  .send-btn:hover { background:#861216; }
  .send-btn svg { width:14px; height:14px; fill:#fff; }

  /* toast */
  .toast {
    position:fixed; bottom:86px; left:50%; transform:translateX(-50%);
    background:#111; color:#fff;
    font-family:'Forum',serif; font-size:0.68rem;
    font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
    padding:9px 20px; border-radius:100px;
    z-index:200; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* footer */
  .footer { text-align:center; padding:30px 24px 22px; border-top:1px solid var(--border); }
  .footer p { font-size:0.58rem; font-weight:500; color:var(--muted); letter-spacing:0.2em; text-transform:uppercase; }

  @media(max-width:480px){
    .item          { padding: 11px 14px; }
    .section-label { padding: 18px 14px 6px; }
    .hero-content  { padding: 42px 14px 92px; }
    .cart-bar      { padding: 12px 14px 20px; }
    .cat-cards     { padding: 8px 8px 0; }
    .cat-tabs      { padding: 0 8px; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-content">
      <img class="brand-logo" src="Assets/logo-banner-nbg.png" alt="Mary Pastelaria">
    </div>
  </header>

  <!-- NAV: sticky, colapsa os cards ao rolar -->
  <nav class="cat-nav" id="cat-nav">

    <div class="cat-cards" id="cat-cards">
      <button class="cat-card active" id="card-pasteis" onclick="selectCat('pasteis')">
        <div class="cat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 L21 19 H3 Z"/></svg></div>
      </button>
      <button class="cat-card" id="card-salgados" onclick="selectCat('salgados')">
        <div class="cat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></div>
      </button>
      <button class="cat-card" id="card-bebidas" onclick="selectCat('bebidas')">
        <div class="cat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6 Q4 14 7 18 Q9 21 12 21 Q15 21 17 18 Q20 14 19 6Z"/></svg></div>
      </button>
    </div>

    <div class="cat-tabs">
      <button class="cat-tab active" id="tab-pasteis"  onclick="selectCat('pasteis')">Pastéis</button>
      <button class="cat-tab"        id="tab-salgados" onclick="selectCat('salgados')">Salgados</button>
      <button class="cat-tab"        id="tab-bebidas"  onclick="selectCat('bebidas')">Bebidas</button>
    </div>

  </nav>

  <main id="menu-wrap"></main>

  <footer class="footer"><p>Toque em + para adicionar ao pedido</p></footer>
</div>

<div class="toast" id="toast"></div>

<div class="cart-bar hidden" id="cart-bar">
  <div class="cart-top">
    <div class="cart-info" id="cart-info"></div>
  </div>
  <div class="delivery-question" id="dq">
    <span class="dq-label">Vai querer entrega?</span>
    <div class="dq-options">
      <button class="dq-btn" id="dq-no"  onclick="chooseDelivery(false)">Retirar no local</button>
      <button class="dq-btn" id="dq-yes" onclick="chooseDelivery(true)">Entrega</button>
    </div>
    <div class="addr-wrap" id="addr-wrap">
      <input class="addr-input" id="addr-input" type="text" placeholder="Rua, número, bairro…" autocomplete="street-address">
    </div>
  </div>
  <button class="send-btn" onclick="handleSend()">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 0C5.373 0 0 5.373 0 12.004c0 2.114.554 4.1 1.522 5.827L0 24l6.351-1.498A11.957 11.957 0 0012.004 24C18.63 24 18.63 0 12.004 0zm0 21.818a9.812 9.812 0 01-5.001-1.368l-.36-.214-3.72.876.916-3.617-.235-.372a9.82 9.82 0 01-1.507-5.119c0-5.425 4.412-9.837 9.837-9.837 5.426 0 9.837 4.412 9.837 9.837S17.43 21.818 12.004 21.818z"/></svg>
    Enviar pedido
  </button>
</div>

<script>
const WA = '5515998304344';

const menu = {
  pasteis:{
    "Simples":[
      {name:"Carne",         price:8},
      {name:"Queijo",        price:8},
      {name:"Frango",        price:8},
      {name:"Pizza",         price:8},
    ],
    "Combinados":[
      {name:"Carne c/ Queijo",     price:10},
      {name:"Frango c/ Queijo",    price:10},
      {name:"Frango c/ Catupiry",  price:10},
      {name:"Calabresa c/ Queijo", price:10},
      {name:"Portuguesa",          price:10},
    ],
    "Especiais":[
      {name:"Costela",              price:15, premium:true},
      {name:"Costela c/ Queijo",    price:15, premium:true},
      {name:"Bacon",                price:15, premium:true},
      {name:"X-Tudo",               price:15, premium:true},
      {name:"Strogonoff de Frango", price:15, premium:true},
      {name:"Carne Seca",           price:15, premium:true},
      {name:"Pernil",               price:15, premium:true},
      {name:"Palmito",              price:15, premium:true},
    ],
    "Doces":[
      {name:"Brigadeiro",            price:12},
      {name:"Prestígio",             price:12},
      {name:"Doce de Leite",         price:12},
      {name:"Brigadeiro c/ Morango", price:12},
      {name:"Banana c/ Canela",      price:12},
      {name:"Nutella",               price:15, premium:true},
      {name:"Romeu e Julieta",       price:12},
    ]
  },
  salgados:{
    "Salgados":[
      {name:"Coxinha de Frango",          price:7},
      {name:"Coxinha de Costela",         price:9, premium:true},
      {name:"Risoles de Presunto/Queijo", price:7},
      {name:"Risoles de Carne",           price:7},
      {name:"Bolinha de Queijo",          price:8},
      {name:"Kibe",                       price:7},
      {name:"Kibe c/ Requeijão",          price:8},
      {name:"Esfiha de Carne",            price:6},
      {name:"Esfiha de Frango",           price:6},
      {name:"Enroladinho de Salsicha",    price:6},
      {name:"Folhado de Calabresa",       price:8},
      {name:"Pão de Queijo",              price:4},
      {name:"Croquete de Carne",          price:6},
    ]
  },
  bebidas:{
    "Bebidas":[
      {name:"Refrigerante Lata",     price:6},
      {name:"Refrigerante 600ml",    price:9},
      {name:"Água sem Gás",          price:4},
      {name:"Água com Gás",          price:5},
      {name:"Suco Natural Laranja",  price:9},
      {name:"Suco Natural Maracujá", price:9},
      {name:"Suco Natural Limão",    price:8},
      {name:"Café Expresso",         price:5},
      {name:"Café com Leite",        price:6},
      {name:"Cappuccino",            price:8},
      {name:"Chá Gelado",            price:7},
      {name:"Caldo de Cana",         price:6},
      {name:"Água de Coco",          price:7},
    ]
  }
};

const cart = new Map();
let dqShown = false, deliveryChoice = null, currentCat = 'pasteis';
const fmt  = n => 'R$ ' + n.toFixed(2).replace('.',',');
const toId = s => s.replace(/[^a-z0-9]/gi,'_');

/* ── STICKY COLLAPSE ── */
const navEl   = document.getElementById('cat-nav');
const navTop  = () => navEl.getBoundingClientRect().top;

window.addEventListener('scroll', () => {
  navEl.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

/* ── CATEGORY ── */
function selectCat(cat) {
  currentCat = cat;
  ['pasteis','salgados','bebidas'].forEach(c => {
    document.getElementById('card-' + c).classList.toggle('active', c === cat);
    document.getElementById('tab-'  + c).classList.toggle('active', c === cat);
  });
  renderMenu(cat);
}

/* ── RESET ── */
function resetCart() {
  cart.clear(); dqShown = false; deliveryChoice = null;
  closeDQ(); refreshBar(); renderMenu(currentCat);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

/* ── RENDER ── */
function renderMenu(cat) {
  const wrap = document.getElementById('menu-wrap');
  let html = '';
  Object.entries(menu[cat]).forEach(([sec, items]) => {
    html += `<div class="section-label"><h2>${sec}</h2></div>`;
    items.forEach(item => {
      const id       = toId(item.name);
      const qty      = cart.has(id) ? cart.get(id).qty : 0;
      const inCart   = qty > 0 ? ' in-cart' : '';
      const premium  = item.premium ? ' premium' : '';
      const safeName = item.name.replace(/'/g,"\\'");
      html += `
        <div class="item${inCart}${premium}" id="row-${id}">
          <span class="item-name">•  ${item.name}</span>
          <div class="item-right">
            <span class="item-price">${fmt(item.price)}</span>
            <div class="item-stepper">
              <button class="btn-stepper minus" onclick="decrement(event,'${id}')">−</button>
              <span class="item-qty" id="qty-${id}">${qty}</span>
              <button class="btn-stepper plus" onclick="increment(event,'${id}','${safeName}',${item.price})">+</button>
            </div>
            <button class="btn-add-initial" onclick="addFirst(event,'${id}','${safeName}',${item.price})">+</button>
          </div>
        </div>`;
    });
  });
  wrap.innerHTML = html;
}

function addFirst(e, id, name, price) {
  e.stopPropagation(); cart.set(id, {name, price, qty:1}); updateRow(id); refreshBar();
}
function increment(e, id, name, price) {
  e.stopPropagation();
  if (cart.has(id)) cart.get(id).qty++; else cart.set(id, {name, price, qty:1});
  updateRow(id); refreshBar();
}
function decrement(e, id) {
  e.stopPropagation(); if (!cart.has(id)) return;
  cart.get(id).qty--;
  if (cart.get(id).qty <= 0) cart.delete(id);
  updateRow(id); refreshBar();
}
function updateRow(id) {
  const row = document.getElementById('row-'+id);
  const badge = document.getElementById('qty-'+id);
  const qty = cart.has(id) ? cart.get(id).qty : 0;
  if (badge) badge.textContent = qty;
  if (row) qty > 0 ? row.classList.add('in-cart') : row.classList.remove('in-cart');
}
function refreshBar() {
  const bar = document.getElementById('cart-bar');
  const info = document.getElementById('cart-info');
  if (!cart.size) { bar.classList.add('hidden'); closeDQ(); return; }
  bar.classList.remove('hidden');
  let total=0, count=0;
  cart.forEach(e => { total += e.price*e.qty; count += e.qty; });
  info.innerHTML = `<strong>${count} ${count===1?'item':'itens'}</strong> &middot; ${fmt(total)}`;
}
function openDQ()  { dqShown=true; document.getElementById('dq').classList.add('open'); }
function closeDQ() {
  dqShown=false; deliveryChoice=null;
  ['dq','addr-wrap'].forEach(id => document.getElementById(id).classList.remove('open'));
  ['dq-yes','dq-no'].forEach(id => document.getElementById(id).classList.remove('chosen'));
  document.getElementById('addr-input').value='';
}
function chooseDelivery(yes) {
  deliveryChoice=yes;
  document.getElementById('dq-yes').classList.toggle('chosen', yes);
  document.getElementById('dq-no').classList.toggle('chosen', !yes);
  document.getElementById('addr-wrap').classList.toggle('open', yes);
  if (yes) setTimeout(() => document.getElementById('addr-input').focus(), 240);
}
function handleSend() {
  if (!cart.size) return;
  if (!dqShown) { openDQ(); return; }
  if (deliveryChoice===null) return;
  if (deliveryChoice) {
    const addr = document.getElementById('addr-input').value.trim();
    if (!addr) { document.getElementById('addr-input').focus(); return; }
  }
  let lines=['*Pedido — Mary Pastelaria*',''], total=0;
  cart.forEach(e => {
    const sub=e.price*e.qty; total+=sub;
    lines.push(`• ${e.qty}x ${e.name} — ${fmt(sub)}`);
  });
  lines.push('',`*Total: ${fmt(total)}*`,'');
  lines.push(deliveryChoice
    ? `- *Entrega:* ${document.getElementById('addr-input').value.trim()}`
    : '- *Retirada no local*');
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
  showToast('Pedido enviado!');
  setTimeout(() => resetCart(), 600);
}

renderMenu('pasteis');
</script>
</body>
</html>
