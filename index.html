<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mary Pastelaria — Cardápio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #f5f3f0;
      --surface:      #ffffff;

      --primary:      #E61A25;
      --primary-dark: #B8141E;
      --primary-soft: rgba(230, 26, 37, 0.07);

      --text:         #1E1B18;
      --text-light:   #5a524a;
      --border:       #ddd6cc;

      --nav-bg:       rgba(245, 243, 240, 0.97);

      --hero-from:    #6b0d11;
      --hero-to:      #b5161c;
      --bg-solid:     #f5f3f0;
    }

    :root.dark {
      --bg:           #12100E;
      --surface:      #1a1816;

      --primary:      #E61A25;
      --primary-dark: #B8141E;
      --primary-soft: rgba(230, 26, 37, 0.10);

      --text:         #f0ebe4;
      --text-light:   #9a9088;
      --border:       #2e2922;

      --nav-bg:       rgba(18, 16, 14, 0.97);

      --hero-from:    #2a0406;
      --hero-to:      #7a0d12;
      --bg-solid:     #12100E;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--bg-solid);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(180deg,
        var(--hero-from) 0%,
        var(--hero-to)   42%,
        var(--bg-solid)  92%
      );
      padding-bottom: 28px;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 28px 10px;
    }

    .brand-logo {
      display: block;
      width: clamp(300px, 95vw, 700px);
      height: auto;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,.6));
    }

    .hero-info {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .brand-contact {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      letter-spacing: .03em;
    }
    .brand-contact:hover { opacity: .82; }
    .wa-icon { width: 14px; height: 14px; fill: rgba(255,255,255,.9); flex-shrink: 0; }

    .brand-addr {
      font-size: .62rem;
      font-weight: 500;
      color: rgba(255,255,255,.88);
      text-shadow: 0 1px 4px rgba(0,0,0,.5), 0 2px 14px rgba(0,0,0,.6);
      letter-spacing: .06em;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── PAGE ── */
    .page {
      max-width: 580px;
      margin: 0 auto;
      padding-bottom: 140px;
    }

    /* ── THEME TOGGLE ── */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 2px;
      cursor: pointer;
      opacity: .85;
      transition: opacity .2s, transform .2s;
    }
    .theme-toggle:hover { opacity: 1; transform: scale(1.06); }
    .theme-toggle svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
    }
    .icon-sun  { display: block; }
    .icon-moon { display: none; }
    :root.dark .icon-sun  { display: none; }
    :root.dark .icon-moon { display: block; }

    /* ── NAV ── */
    .cat-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 20px;
      transition: background .3s;
    }

    .cat-btn {
      flex: 1;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: .62rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--text-light);
      padding: 15px 8px 13px;
      border-bottom: 2px solid transparent;
      transition: color .18s, border-color .18s;
    }
    .cat-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .cat-btn:hover:not(.active) { color: var(--text); }

    /* ── SECTION LABEL ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 30px 20px 12px;
    }
    .section-label h2 {
      font-size: .54rem;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .menu-hint {
      font-size: .46rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-light);
      opacity: .45;
      white-space: nowrap;
      flex-shrink: 0;
      padding-left: 4px;
    }

    /* ── ITEMS ── */
    .item {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .item:last-child { border-bottom: none; }

    .item-main {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 0;
      overflow: hidden;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      padding: 12px 10px 12px 20px;
      position: relative;
    }

    /* narrow zones near each button — avoids accidental taps while scrolling */
    .item-left .zone-dec,
    .item-left .zone-inc {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 44px;
      z-index: 1;
    }
    .item-left .zone-dec { left: 0; }
    .item-left .zone-inc { right: 0; }

    /* tooltip hint on item-left */
    .item-left::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(30,27,24,.82);
      color: rgba(255,255,255,.9);
      font-size: .48rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s, transform .18s;
      z-index: 10;
    }
    .item-left:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .item-marker {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background .15s, transform .15s;
    }
    .item.in-cart .item-marker {
      background: var(--primary);
      transform: scale(1.4);
    }

    .item-name {
      font-size: .74rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .01em;
      flex: 1;
      min-width: 0;
    }

    .item.in-cart {
      background: var(--primary-soft);
    }
    .item.in-cart .item-left { padding-left: 17px; }

    .item-dots {
      flex: 1;
      border-bottom: 1px dotted var(--border);
      min-width: 8px;
      position: relative;
      top: -1px;
    }

    /* qty badge shown left of price */
    .item-qty-badge {
      font-size: .7rem;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .item.in-cart .item-qty-badge { opacity: 1; }

    .item-price {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-light);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .item.premium .item-price { color: var(--primary); }

    /* ── STEPPER (full-height touch targets) ── */
    .item-controls {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      gap: 0;
    }

    .ctrl-btn {
      /* no fixed size — stretches full row height */
      width: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-light);
      font-size: 1.1rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s, background .12s;
      padding: 0;
    }
    .ctrl-btn:hover  { color: var(--primary); background: var(--primary-soft); }
    .ctrl-btn:active { background: rgba(230,26,37,.15); }

    .ctrl-count {
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--border);
      font-size: .78rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      background: none;
      transition: color .15s;
      padding: 0;
    }
    .ctrl-count.zero { color: var(--border); }

    /* ── ITEM OBSERVATION (SUBTIL) ── */
    .item-obs-container {
      display: flex;
      flex-direction: column;
      padding: 0 20px 8px 52px; /* Alinhado com o nome do item */
      font-size: .6rem;
    }
    
    .item-obs-trigger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-light);
      opacity: .5;
      transition: opacity .15s, color .15s;
      font-size: .5rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      width: fit-content;
    }
    .item-obs-trigger:hover {
      opacity: 1;
      color: var(--primary);
    }
    .item-obs-trigger.active {
      opacity: 1;
      color: var(--primary);
    }
    .item-obs-trigger svg {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }
    
    .item-obs-field {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .26s ease, opacity .22s ease;
      margin-top: 4px;
    }
    .item-obs-field.open { 
      max-height: 60px; 
      opacity: 1; 
    }
    .item-obs-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: .65rem;
      font-weight: 400;
      padding: 6px 8px;
      outline: none;
      transition: border-color .18s;
    }
    .item-obs-input:focus { border-color: var(--primary); }
    .item-obs-input::placeholder {
      color: var(--text-light);
      opacity: .5;
      font-style: italic;
    }

    /* ── MODE CARD ── */
    .mode-card {
      margin: 0 20px;
      padding: 5px 10px 5px 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      opacity: .55;
      transition: opacity .2s, border-color .2s;
    }
    .mode-card:hover { opacity: .85; }
    .mode-card-label {
      font-size: .5rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-light);
    }
    .mode-card-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: .5rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-light);
      padding: 4px 0;
      transition: color .15s;
      white-space: nowrap;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .mode-card-btn:hover { color: var(--primary); }
    body.order-mode .mode-card { opacity: .7; border-color: rgba(230,26,37,.25); }
    body.order-mode .mode-card-label { color: var(--primary); }
    body.order-mode .mode-card-btn { color: var(--primary); }

    /* hide stepper and obs in read mode */
    .item .item-controls:first-child,
    .item .item-controls:last-child,
    .item-obs-container {
      transition: opacity .18s;
    }
    body:not(.order-mode) .item .item-controls:first-child,
    body:not(.order-mode) .item .item-controls:last-child,
    body:not(.order-mode) .item-obs-container {
      display: none;
    }
    body:not(.order-mode) .item.in-cart { background: var(--surface); }
    body:not(.order-mode) .item.in-cart .item-left { padding-left: 20px; }
    body:not(.order-mode) .item.in-cart .item-marker { background: var(--border); transform: none; }

    /* ── SUMMARY MODAL (centered pop-up) ── */
    .summary-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 149;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .summary-overlay.open { opacity: 1; pointer-events: all; }

    .summary-sheet {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%) scale(.96);
      width: calc(100% - 32px);
      max-width: 480px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      border-radius: 0 0 2px 2px;
      z-index: 150;
      transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .25s;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
    }
    .summary-sheet.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .summary-title {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text);
    }
    .summary-close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      color: var(--text-light);
      font-size: 1.1rem;
      line-height: 1;
      transition: color .15s, border-color .15s;
    }
    .summary-close:hover { color: var(--primary); border-color: var(--primary); }

    .summary-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }
    .summary-row {
      display: flex;
      flex-direction: column;
      padding: 9px 20px;
      border-bottom: 1px solid var(--border);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .summary-row-name {
      font-size: .85rem;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }
    .summary-row-qty {
      font-size: .72rem;
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .summary-row-price {
      font-family: 'Playfair Display', serif;
      font-size: .88rem;
      font-weight: 700;
      color: var(--text-light);
      white-space: nowrap;
    }
    .summary-row-obs {
      font-size: .55rem;
      color: var(--text-light);
      font-style: italic;
      margin-top: 4px;
      padding-left: 8px;
      border-left: 2px solid var(--primary);
      opacity: .7;
      line-height: 1.4;
    }
    
    /* borderline text for fees */
    .summary-fees {
      padding: 8px 20px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 4px;
    }
    .fee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .55rem;
      letter-spacing: .06em;
      color: var(--text-light);
      opacity: .7;
    }
    .fee-row span:last-child {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
    }
    .fee-divider {
      text-align: center;
      font-size: .45rem;
      letter-spacing: .2em;
      color: var(--border);
      margin: 2px 0;
    }
    
    .summary-total {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .summary-total-label {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-light);
    }
    .summary-total-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* cart-bar: compact, info + open-summary button only */
    .cart-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .review-btn {
      background: var(--primary);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s;
      flex-shrink: 0;
    }
    .review-btn:hover { background: var(--primary-dark); }
    .review-btn svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* delivery + send inside modal */
    .summary-actions {
      padding: 12px 20px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .summary-addr-wrap {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .26s ease, opacity .22s ease;
      margin-bottom: 0;
    }
    .summary-addr-wrap.open { 
      max-height: 80px; 
      opacity: 1; 
      margin-bottom: 2px; 
    }
    .summary-send-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      padding: 12px 22px 28px;
      z-index: 100;
      transition: transform .28s ease;
    }
    .cart-bar.hidden {
      transform: translateX(-50%) translateY(120%);
    }

    .cart-info {
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .cart-info strong { color: var(--text); font-weight: 600; }

    .cart-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .send-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 13px 0;
      transition: background .18s;
    }
    .send-btn:hover { background: var(--primary-dark); }
    .send-btn svg { width: 13px; height: 13px; fill: #fff; flex-shrink: 0; }

    /* toggle row in modal */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .58rem;
      font-weight: 600;
      letter-spacing: .10em;
      color: var(--text-light);
      text-transform: uppercase;
    }
    .toggle-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-light);
      fill: none;
      stroke-width: 1.8;
    }
    .toggle-switch {
      position: relative;
      width: 38px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 2px;
      transition: background .2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      background: var(--text-light);
      border-radius: 1px;
      transition: transform .2s, background .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--primary); }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #fff;
    }

    .addr-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: .85rem;
      font-weight: 400;
      padding: 10px 12px;
      outline: none;
      transition: border-color .18s;
    }
    .addr-input::placeholder { 
      color: var(--text-light); 
      opacity: .6; 
    }
    .addr-input:focus { 
      border-color: var(--primary); 
    }

    /* ── WA READ BAR (read mode only) ── */
    .wa-read-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border-top: 2px solid var(--primary);
      padding: 12px 22px 28px;
      z-index: 100;
    }
    body:not(.order-mode) .wa-read-bar { display: block; }
    body.order-mode .wa-read-bar { display: none; }
    .wa-read-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 13px 0;
      text-decoration: none;
      transition: background .18s;
    }
    .wa-read-btn:hover { background: #1ebe5b; }
    .wa-read-btn svg { width: 15px; height: 15px; fill: #fff; flex-shrink: 0; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 40px 20px 26px;
      border-top: 1px solid var(--border);
    }
    .footer-line {
      width: 1px;
      height: 22px;
      background: var(--primary);
      margin: 0 auto 16px;
      opacity: .4;
    }
    .footer p {
      font-size: .6rem;
      font-weight: 500;
      color: var(--text-light);
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .6;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cat-nav { animation: fadeUp .4s ease both; }
    .fade-in  { animation: fadeUp .18s ease both; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .item          { padding: 11px 14px; }
      .item.in-cart  { padding-left: 11px; }
      .section-label { padding: 24px 14px 10px; }
      .cart-bar      { padding: 12px 16px 30px; }
      .cat-nav       { padding: 0 4px; }
      .brand-logo    { width: clamp(260px, 90vw, 600px); }
    }
  </style>
</head>

  <script>
    // Tema escuro como padrão
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    
    (function () {
      // Tema escuro como padrão - sempre inicia com dark a menos que tenha light salvo
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        // Padrão é dark
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    })();

    const WA = '5515998304344';
    const DELIVERY_FEE = 3; // R$ 3,00
    
    const menu = {
      pasteis: {
        "Simples": [
          { name:"Carne",  price:8 }, { name:"Queijo",  price:8 },
          { name:"Frango", price:8 }, { name:"Pizza",   price:8 }
        ],
        "Combinados": [
          { name:"Carne c/ Queijo",      price:10 }, { name:"Frango c/ Queijo",    price:10 },
          { name:"Frango c/ Catupiry",   price:10 }, { name:"Calabresa c/ Queijo", price:10 },
          { name:"Portuguesa",           price:10 }
        ],
        "Especiais": [
          { name:"Costela",              price:15, premium:true }, { name:"Costela c/ Queijo",      price:15, premium:true },
          { name:"Bacon",                price:15, premium:true }, { name:"X-Tudo",                 price:15, premium:true },
          { name:"Strogonoff de Frango", price:15, premium:true }, { name:"Carne Seca",             price:15, premium:true },
          { name:"Pernil",               price:15, premium:true }, { name:"Palmito",                price:15, premium:true }
        ],
        "Doces": [
          { name:"Brigadeiro",           price:12 }, { name:"Prestígio",             price:12 },
          { name:"Doce de Leite",        price:12 }, { name:"Brigadeiro c/ Morango", price:12 },
          { name:"Banana c/ Canela",     price:12 }, { name:"Nutella",               price:15, premium:true },
          { name:"Romeu e Julieta",      price:12 }
        ]
      },
      salgados: {
        "Salgados": [
          { name:"Coxinha de Frango",          price:7  }, { name:"Coxinha de Costela",      price:9, premium:true },
          { name:"Risoles de Presunto/Queijo", price:7  }, { name:"Risoles de Carne",        price:7  },
          { name:"Bolinha de Queijo",          price:8  }, { name:"Kibe",                    price:7  },
          { name:"Kibe c/ Requeijão",          price:8  }, { name:"Esfiha de Carne",         price:6  },
          { name:"Esfiha de Frango",           price:6  }, { name:"Enroladinho de Salsicha", price:6  },
          { name:"Folhado de Calabresa",       price:8  }, { name:"Pão de Queijo",           price:4  },
          { name:"Croquete de Carne",          price:6  }
        ]
      },
      bebidas: {
        "Bebidas": [
          { name:"Refrigerante Lata",    price:6 }, { name:"Refrigerante 600ml",    price:9 },
          { name:"Água sem Gás",         price:4 }, { name:"Água com Gás",          price:5 },
          { name:"Suco Natural Laranja", price:9 }, { name:"Suco Natural Maracujá", price:9 },
          { name:"Suco Natural Limão",   price:8 }, { name:"Café Expresso",         price:5 },
          { name:"Café com Leite",       price:6 }, { name:"Cappuccino",            price:8 },
          { name:"Chá Gelado",           price:7 }, { name:"Caldo de Cana",         price:6 },
          { name:"Água de Coco",         price:7 }
        ]
      }
    };

    const cart = new Map(); // Agora cada item pode ter { name, price, qty, obs }
    let wantsDelivery = false;
    let orderMode = false; // COMEÇA SEMPRE EM MODO LEITURA (false)
    const fmt  = n => 'R$ ' + n.toFixed(2).replace('.', ',');
    const toId = s => s.replace(/[^a-z0-9]/gi, '_');

    function renderMenu(cat) {
      const wrap = document.getElementById('menu-wrap');
      let html = '';
      let isFirst = true;
      Object.entries(menu[cat]).forEach(([sec, items]) => {
        html += `<div class="section-label"><h2>${sec}</h2>${isFirst ? '<span class="menu-hint">← remover &nbsp;·&nbsp; adicionar →</span>' : ''}</div>`;
        isFirst = false;
        items.forEach(item => {
          const id  = toId(item.name);
          const cartItem = cart.get(id);
          const qty = cartItem ? cartItem.qty : 0;
          const obs = cartItem ? cartItem.obs || '' : '';
          const safeName = item.name.replace(/'/g, "\'");
          const obsActive = cartItem && cartItem.obs ? 'active' : '';
          
          html += `
            <div class="item${qty>0?' in-cart':''}${item.premium?' premium':''} fade-in" id="row-${id}">
              <div class="item-main">
                <div class="item-controls">
                  <button class="ctrl-btn ctrl-dec" onclick="dec('${id}','${safeName}',${item.price})" style="border-left:none;border-right:1px solid var(--border)">&#8722;</button>
                  <span class="ctrl-count${qty===0?' zero':''}" id="qty-${id}">${qty}</span>
                </div>
                <div class="item-left" data-tip="← remover · adicionar →">
                  <span class="zone-dec" onclick="dec('${id}','${safeName}',${item.price})"></span>
                  <span class="zone-inc" onclick="tap('${id}','${safeName}',${item.price})"></span>
                  <span class="item-marker"></span>
                  <span class="item-name">${item.name}</span>
                  <span class="item-dots"></span>
                  <span class="item-qty-badge" id="badge-${id}">${qty>0?qty+'×':''}</span>
                  <span class="item-price">${fmt(item.price)}</span>
                </div>
                <div class="item-controls">
                  <button class="ctrl-btn ctrl-inc" onclick="tap('${id}','${safeName}',${item.price})">+</button>
                </div>
              </div>
              
              <div class="item-obs-container">
                <span class="item-obs-trigger ${obsActive}" onclick="toggleItemObs('${id}')">
                  <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  <span>${cartItem && cartItem.obs ? 'editar' : 'obs'}</span>
                </span>
                <div class="item-obs-field ${cartItem && cartItem.obs ? 'open' : ''}" id="obs-field-${id}">
                  <textarea class="item-obs-input" id="obs-${id}" 
                    placeholder="Ex: sem cebola, ponto da carne..."
                    onchange="updateItemObs('${id}', this.value)"
                    rows="1">${obs}</textarea>
                </div>
              </div>
            </div>`;
        });
      });
      wrap.innerHTML = html;
    }

    function toggleItemObs(id) {
      if (!orderMode) return;
      const field = document.getElementById('obs-field-' + id);
      const trigger = document.querySelector(`#row-${id} .item-obs-trigger`);
      const item = cart.get(id);
      
      if (field.classList.contains('open')) {
        field.classList.remove('open');
        trigger?.classList.remove('active');
        if (item && !item.obs) {
          // Se não tem obs salva, remove active
        }
      } else {
        field.classList.add('open');
        trigger?.classList.add('active');
        setTimeout(() => document.getElementById('obs-' + id)?.focus(), 260);
      }
    }

    function updateItemObs(id, value) {
      if (!orderMode || !cart.has(id)) return;
      const item = cart.get(id);
      const trimmed = value.trim();
      item.obs = trimmed || undefined;
      
      // Atualiza o texto do trigger
      const triggerSpan = document.querySelector(`#row-${id} .item-obs-trigger span`);
      if (triggerSpan) {
        triggerSpan.textContent = trimmed ? 'editar' : 'obs';
      }
      
      // Se limpou o campo e está vazio, pode fechar se quiser (opcional)
      if (!trimmed) {
        const trigger = document.querySelector(`#row-${id} .item-obs-trigger`);
        trigger?.classList.remove('active');
      }
    }

    function tap(id, n, p) {
      if (!orderMode) return; // SÓ FUNCIONA EM MODO PEDIDO
      if (cart.has(id)) {
        const item = cart.get(id);
        item.qty++;
      } else {
        cart.set(id, { name:n, price:p, qty:1, obs: undefined });
      }
      sync(id);
    }
    
    function dec(id) {
      if (!orderMode) return; // SÓ FUNCIONA EM MODO PEDIDO
      if (!cart.has(id)) return;
      const e = cart.get(id);
      if (--e.qty <= 0) cart.delete(id);
      sync(id);
    }

    function sync(id) {
      const qty   = cart.has(id) ? cart.get(id).qty : 0;
      const row   = document.getElementById('row-' + id);
      const ctr   = document.getElementById('qty-' + id);
      const badge = document.getElementById('badge-' + id);
      if (ctr)   { ctr.textContent = qty; ctr.classList.toggle('zero', qty === 0); }
      if (badge) badge.textContent = qty > 0 ? qty + '×' : '';
      if (row)   row.classList.toggle('in-cart', qty > 0);
      refreshBar();
    }

    function refreshBar() {
      const bar = document.getElementById('cart-bar');
      if (!cart.size || !orderMode) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      let total = 0, count = 0;
      cart.forEach(e => { total += e.price * e.qty; count += e.qty; });
      document.getElementById('cart-info').innerHTML =
        `<strong>${count} ${count===1?'item':'itens'}</strong> &middot; ${fmt(total)}`;
    }

    function onToggleDelivery(v) {
      wantsDelivery = v;
      document.getElementById('summary-addr-wrap').classList.toggle('open', v);
      if (v) setTimeout(() => document.getElementById('addr-input').focus(), 260);
      updateSummaryTotal();
    }

    function calculateSubtotal() {
      let total = 0;
      cart.forEach(e => { total += e.price * e.qty; });
      return total;
    }

    function updateSummaryTotal() {
      const subtotal = calculateSubtotal();
      const delivery = wantsDelivery ? DELIVERY_FEE : 0;
      const total = subtotal + delivery;
      
      document.getElementById('summary-subtotal').textContent = fmt(subtotal);
      document.getElementById('summary-delivery').textContent = delivery > 0 ? fmt(delivery) : 'R$ 0,00';
      document.getElementById('summary-total-value').textContent = fmt(total);
    }

    function handleSend() {
      if (!cart.size) return;
      if (wantsDelivery && !document.getElementById('addr-input').value.trim()) {
        document.getElementById('addr-input').focus();
        return;
      }
      
      const subtotal = calculateSubtotal();
      const delivery = wantsDelivery ? DELIVERY_FEE : 0;
      const total = subtotal + delivery;
      
      let lines = ['🥟 *Pedido — Mary Pastelaria*', ''];
      
      cart.forEach(e => {
        const s = e.price * e.qty;
        lines.push(`• ${e.qty}x ${e.name} — ${fmt(s)}`);
        if (e.obs) {
          lines.push(`   └ Obs: ${e.obs}`);
        }
      });
      
      lines.push('', `*Subtotal: ${fmt(subtotal)}*`);
      if (delivery > 0) lines.push(`*Entrega: ${fmt(delivery)}*`);
      lines.push('', `*TOTAL: ${fmt(total)}*`, '');
      
      lines.push(wantsDelivery
        ? `📍 *Entrega:* ${document.getElementById('addr-input').value.trim()}`
        : '🏠 *Retirada no local*');
      
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
    }

    let currentCat = 'pasteis';
    
    function selectCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = cat;
      renderMenu(cat);
    }

    function openSummary() {
      const list = document.getElementById('summary-list');
      let rows = '';
      
      cart.forEach(e => {
        const sub = e.price * e.qty;
        rows += `<div class="summary-row">
          <div class="summary-row-main">
            <span class="summary-row-name">${e.name}</span>
            <span class="summary-row-qty">${e.qty}×</span>
            <span class="summary-row-price">${fmt(sub)}</span>
          </div>
          ${e.obs ? `<div class="summary-row-obs">📝 ${e.obs}</div>` : ''}
        </div>`;
      });
      
      list.innerHTML = rows;
      updateSummaryTotal();
      
      document.getElementById('summary-sheet').classList.add('open');
      document.getElementById('summary-overlay').classList.add('open');
    }

    function closeSummary() {
      document.getElementById('summary-sheet').classList.remove('open');
      document.getElementById('summary-overlay').classList.remove('open');
    }

    function toggleMode() {
      orderMode = !orderMode;
      localStorage.setItem('mode', orderMode ? 'order' : 'read');
      applyMode();
      renderMenu(currentCat);
    }

    function applyMode() {
      document.body.classList.toggle('order-mode', orderMode);
      document.getElementById('mode-label').textContent = orderMode ? 'Pedido' : 'Leitura';
      document.getElementById('mode-btn').textContent   = orderMode ? 'Encerrar' : 'Ativar opções de pedido';
      
      if (!orderMode) {
        // Limpar carrinho ao sair do modo pedido
        cart.clear();
        wantsDelivery = false;
        document.getElementById('cart-bar').classList.add('hidden');
        document.getElementById('summary-sheet').classList.remove('open');
        document.getElementById('summary-overlay').classList.remove('open');
        document.getElementById('delivery-toggle').checked = false;
        document.getElementById('summary-addr-wrap').classList.remove('open');
        document.getElementById('addr-input').value = '';
      }
      
      // Re-renderizar a categoria atual para atualizar a UI
      renderMenu(currentCat);
    }

    // Inicialização
    renderMenu('pasteis');
    applyMode(); // Aplica modo leitura (padrão)
  </script>
  
  <!-- Summary overlay -->
  <div class="summary-overlay" id="summary-overlay" onclick="closeSummary()"></div>

  <!-- Summary sheet -->
  <div class="summary-sheet" id="summary-sheet">
    <div class="summary-header">
      <span class="summary-title">Resumo do pedido</span>
      <button class="summary-close" onclick="closeSummary()">&#x2715;</button>
    </div>
    <div class="summary-list" id="summary-list"></div>
    
    <!-- Borderline text with fees -->
    <div class="summary-fees">
      <div class="fee-row">
        <span>Subtotal</span>
        <span id="summary-subtotal">R$ 0,00</span>
      </div>
      <div class="fee-row">
        <span>Entrega</span>
        <span id="summary-delivery">R$ 0,00</span>
      </div>
      <div class="fee-divider">• • •</div>
    </div>
    
    <div class="summary-total">
      <span class="summary-total-label">Total</span>
      <span class="summary-total-value" id="summary-total-value">R$ 0,00</span>
    </div>
    
    <div class="summary-actions">
      <!-- Delivery toggle row -->
      <label class="toggle-row" onclick="">
        <span class="toggle-label">
          <svg viewBox="0 0 24 24">
            <rect x="1" y="3" width="15" height="13" rx="1"/>
            <path d="M16 8h4l3 5v3h-7V8z"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
          Delivery (+R$ 3,00)
        </span>
        <span class="toggle-switch">
          <input type="checkbox" id="delivery-toggle" onchange="onToggleDelivery(this.checked)">
          <span class="toggle-track"></span>
        </span>
      </label>
      <div class="summary-addr-wrap" id="summary-addr-wrap">
        <input class="addr-input" id="addr-input" type="text"
          placeholder="Endereço completo para entrega" autocomplete="street-address">
      </div>

      <!-- Send row -->
      <div class="summary-send-row">
