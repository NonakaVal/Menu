<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mary Pastelaria — Cardápio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #f5f2ee;
      --surface:     #ffffff;
      --red:         #c4200e;
      --red-dim:     #a01b0b;
      --text:        #0e0c0a;
      --muted:       #6b6560;
      --border:      #e0dad2;
      --nav-bg:      rgba(245, 242, 238, 0.95);
      --hero-mid1:   #e8b0a4;
      --hero-mid2:   #f0ddd8;
    }
    :root.dark {
      --bg:          #100e0c;
      --surface:     #181410;
      --red:         #e0311e;
      --red-dim:     #b02410;
      --text:        #ede8df;
      --muted:       #7a7068;
      --border:      #282320;
      --nav-bg:      rgba(16, 14, 12, 0.95);
      --hero-mid1:   #3c1a10;
      --hero-mid2:   #1e0e0a;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    /* ── THEME TOGGLE — minimal line icon ── */
    .theme-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 200;

  width: 26px;
  height: 26px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  border: none; /* remove contorno */
  cursor: pointer;

  opacity: 0.7;
  transition: opacity .2s ease, transform .2s ease;
}

.theme-toggle:hover {
  opacity: 1;
  transform: scale(1.08);
}
    .theme-toggle:hover { border-color: var(--red); }
    .theme-toggle svg {
  width: 12px;
  height: 12px;
  stroke-width: 1.6;
}
    .theme-toggle:hover svg { stroke: var(--red); }

    /* sun icon */
    .icon-sun { display: block; }
    .icon-moon { display: none; }
    :root.dark .icon-sun { display: none; }
    :root.dark .icon-moon { display: block; }

    /* ── HERO ── */
    .hero {
      /* vermelho sólido ocupa 62% — degradê só na parte inferior */
      background: linear-gradient(to bottom,
        #ae0f18 0%,
        #c51820 40%,
        #c82020 62%,
        var(--hero-mid1) 78%,
        var(--hero-mid2) 90%,
        var(--bg) 100%);
      position: relative;
      overflow: hidden;
      transition: background .3s;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(0,0,0,.22) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* padding bottom generoso para o degradê acontecer abaixo do conteúdo */
      padding: 44px 28px 90px;
    }
    .brand-logo {
  display: block;
  width: clamp(300px, 95vw, 700px);
  height: auto;
  filter: drop-shadow(0 5px 24px rgba(0,0,0,.45));
}
    /* pill de contato — fundo semitransparente garante legibilidade em qualquer tema */
    .hero-info {
  margin-top: 12px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;

  padding: 0;

  background: none;
  backdrop-filter: none;
}
    .brand-contact {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .04em;
      color: #fff;
      text-decoration: none;
      text-shadow: #0e0c0a 0px 2px 3px;
    }
    .brand-contact:hover { opacity: .85; }
    .wa-icon { width:14px; height:14px; fill:rgba(255,255,255,.8); flex-shrink:0; }
    .brand-addr {
      font-size: .55rem;
      font-weight: 400;
      letter-spacing: .06em;
      color: rgba(255,255,255,.72);
      text-align: center;
      text-shadow: #0e0c0a 0px 2px 3px;
    }

    /* ── PAGE WRAPPER ── */
    .page {
      max-width: 580px;
      margin: 0 auto;
      padding-bottom: 140px;
    }

    /* ── NAV ── */
    .cat-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 20px;
      transition: background .3s;
    }
    .cat-btn {
      flex: 1;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: .62rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 15px 8px 13px;
      border-bottom: 1.5px solid transparent;
      transition: color .18s, border-color .18s;
    }
    .cat-btn.active { color: var(--text); border-bottom-color: var(--red); }
    .cat-btn:hover:not(.active) { color: var(--text); }

    /* ── SECTION LABEL ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 30px 28px 14px;
    }
    .section-label h2 {
      font-size: .54rem;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 600;
      white-space: nowrap;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .menu-hint {
      font-size: .46rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: .35;
      white-space: nowrap;
      flex-shrink: 0;
      padding-left: 4px;
    }

    /* ── ITEMS ── */
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .item:last-child { border-bottom: none; }

    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      padding: 3px 0;
    }
    .item-left:active { opacity: .65; }

    .item-marker {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background .15s, transform .15s;
    }
    .item.in-cart .item-marker {
      background: var(--red);
      transform: scale(1.3);
    }

    .item-name {
      font-size: .82rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: .01em;
      flex: 1;
      min-width: 0;
      transition: color .15s;
    }
    .item.in-cart .item-name { color: var(--red); }

    .item-dots {
      flex: 1;
      border-bottom: 1px dotted var(--border);
      min-width: 10px;
      position: relative;
      top: -1px;
    }

    .item-qty {
      font-size: .65rem;
      color: var(--red);
      min-width: 18px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }

    .item-price {
      font-family: 'Playfair Display', serif;
      font-size: .92rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .item.premium .item-price { color: var(--red); }

    .item-controls {
      display: none;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .item.in-cart .item-controls { display: flex; }

    .ctrl-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1;
      flex-shrink: 0;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .15s, color .15s;
    }
    .ctrl-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 22px 22px;
      z-index: 100;
      transition: transform .28s ease, opacity .28s ease;
    }
    .cart-bar.hidden {
      transform: translateX(-50%) translateY(110%);
      opacity: 0;
      pointer-events: none;
    }

    .cart-top {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .cart-info {
      font-size: .78rem;
      color: var(--muted);
    }
    .cart-info strong { color: var(--text); font-weight: 400; }

    .cart-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .send-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .68rem;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 13px 0;
      transition: background .18s;
    }
    .send-btn:hover { background: var(--red-dim); }
    .send-btn svg { width:13px; height:13px; fill:#fff; flex-shrink:0; }

    .delivery-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle-label {
      font-size: .58rem;
      letter-spacing: .1em;
      color: var(--muted);
      white-space: nowrap;
    }
    .toggle-switch {
      position: relative;
      width: 38px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 10px;
      transition: background .2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--red-dim); }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #fff;
    }

    .addr-wrap {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .26s ease, opacity .22s ease, margin .22s ease;
      margin-bottom: 0;
    }
    .addr-wrap.open { max-height: 54px; opacity: 1; margin-bottom: 10px; }

    .addr-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 300;
      padding: 9px 12px;
      outline: none;
      transition: border-color .18s;
    }
    .addr-input::placeholder { color: var(--muted); }
    .addr-input:focus { border-color: var(--red); }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 40px 28px 26px;
      border-top: 1px solid var(--border);
    }
    .footer-line {
      width: 1px;
      height: 22px;
      background: var(--red);
      margin: 0 auto 16px;
      opacity: .5;
    }
    .footer p {
      font-size: .6rem;
      color: var(--muted);
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .6;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .cat-nav { animation: fadeUp .5s .06s ease both; }
    .fade-in  { animation: fadeUp .18s ease both; }

    /* ── RESPONSIVE ── */
    @media(max-width:480px) {
      .item { padding: 9px 16px; }
      .section-label { padding: 24px 16px 12px; }
      .cart-bar { padding: 12px 16px 18px; }
      .cat-nav { padding: 0 4px; }
      .brand-logo {
  width: clamp(260px, 90vw, 600px);
}
    }
  </style>
</head>

    (function () {
      if (localStorage.getItem('theme') === 'dark') {

          { name:"Café com Leite",       price:6 }, { name:"Cappuccino",           price:8 },
          { name:"Chá Gelado",           price:7 }, { name:"Caldo de Cana",        price:6 },
          { name:"Água de Coco",         price:7 }
        ]
      }
    };

    const cart = new Map();
    let wantsDelivery = false;
    const fmt = n => 'R$ ' + n.toFixed(2).replace('.', ',');
    const toId = s => s.replace(/[^a-z0-9]/gi, '_');

    function renderMenu(cat) {
      const wrap = document.getElementById('menu-wrap');
      let html = '';
      let isFirst = true;
      Object.entries(menu[cat]).forEach(([sec, items]) => {
        html += `<div class="section-label"><h2>${sec}</h2>${isFirst ? '<span class="menu-hint">toque para selecionar</span>' : ''}</div>`;
        isFirst = false;
        items.forEach(item => {
          const id = toId(item.name);
          const qty = cart.has(id) ? cart.get(id).qty : 0;
          html += `<div class="item${qty>0?' in-cart':''}${item.premium?' premium':''} fade-in" id="row-${id}">
            <div class="item-left" onclick="tap('${id}','${item.name.replace(/'/g,"\\'")}',${item.price})">
              <span class="item-marker"></span>
              <span class="item-name">${item.name}</span>
              <span class="item-qty" id="qty-${id}">${qty>0?'×'+qty:''}</span>
              <span class="item-dots"></span>
              <span class="item-price">${fmt(item.price)}</span>
            </div>
            <div class="item-controls">
              <button class="ctrl-btn" onclick="dec('${id}')">−</button>
              <button class="ctrl-btn" onclick="inc('${id}','${item.name.replace(/'/g,"\\'")}',${item.price})">+</button>
            </div>
          </div>`;
        });
      });
      wrap.innerHTML = html;
    }

    function tap(id, n, p) { cart.has(id) ? cart.get(id).qty++ : cart.set(id, { name:n, price:p, qty:1 }); sync(id); }
    function inc(id, n, p) { cart.has(id) ? cart.get(id).qty++ : cart.set(id, { name:n, price:p, qty:1 }); sync(id); }
    function dec(id) {
      if (!cart.has(id)) return;
      const e = cart.get(id);
      e.qty--;
      if (e.qty <= 0) cart.delete(id);
      sync(id);
    }

    function sync(id) {
      const qty = cart.has(id) ? cart.get(id).qty : 0;
      const row = document.getElementById('row-' + id);
      const badge = document.getElementById('qty-' + id);
      if (badge) badge.textContent = qty > 0 ? '×' + qty : '';
      if (row) row.classList.toggle('in-cart', qty > 0);
      refreshBar();
    }

    function refreshBar() {
      const bar = document.getElementById('cart-bar');
      if (!cart.size) {
        bar.classList.add('hidden');
        document.getElementById('delivery-toggle').checked = false;
        wantsDelivery = false;
        document.getElementById('addr-wrap').classList.remove('open');
        document.getElementById('addr-input').value = '';
        return;
      }
      bar.classList.remove('hidden');
      let total = 0, count = 0;
      cart.forEach(e => { total += e.price * e.qty; count += e.qty; });
      document.getElementById('cart-info').innerHTML =
        `<strong>${count} ${count===1?'item':'itens'}</strong> &middot; ${fmt(total)}`;
    }

    function onToggleDelivery(v) {
      wantsDelivery = v;
      document.getElementById('addr-wrap').classList.toggle('open', v);
      if (v) setTimeout(() => document.getElementById('addr-input').focus(), 260);
    }

    function handleSend() {
      if (!cart.size) return;
      if (wantsDelivery) {
        const a = document.getElementById('addr-input').value.trim();
        if (!a) { document.getElementById('addr-input').focus(); return; }
      }
      let lines = ['🥟 *Pedido — Mary Pastelaria*', ''];
      let total = 0;
      cart.forEach(e => {
        const s = e.price * e.qty;
        total += s;
        lines.push(`• ${e.qty}x ${e.name} — ${fmt(s)}`);
      });
      lines.push('', `*Total: ${fmt(total)}*`, '');
      lines.push(wantsDelivery
        ? `📍 *Entrega:* ${document.getElementById('addr-input').value.trim()}`
        : '🏠 *Retirada no local*');
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
    }

    function selectCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu(cat);
    }

    renderMenu('pasteis');
  </script>
</body>
</html>
