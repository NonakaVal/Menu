<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Pastelaria — Cardápio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        /* ── Tema Claro (padrão) ── */
        :root {
            --bg: #f4f1ed;
            --surface: #ffffff;
            --red: #a8220d;
            --red-dim: #891a09;
            --text: #0e0c0a;
            --muted: #5a5450;
            --border: #d4cec7;
            --header-gradient: linear-gradient(to bottom, #a8220d 0%, #a8220d 60%, #f4f1ed 100%);
            --nav-bg: rgba(244, 241, 237, 0.96);
        }

        /* ── Tema Escuro ── */
        :root.dark {
            --bg: #0f0d0b;
            --surface: #161310;
            --red: #c42c15;
            --red-dim: #a8220d;
            --text: #ede8e0;
            --muted: #7a7068;
            --border: #272320;
            --header-gradient: linear-gradient(to bottom, #a8220d 0%, #a8220d 60%, #0f0d0b 100%);
            --nav-bg: rgba(15, 13, 11, 0.96);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            transition: background .3s, color .3s;
        }

        /* ── HERO — só visual, sem nav dentro ── */
        .hero {
    background: linear-gradient(to bottom,
        #3d0206 0%,
        #7a040c 25%,
        #af0611 50%,
        #ff4d57 75%,
        #ffe3e5 90%,
        #ffffff 100%);
    position: relative;
}
}

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 65% at 0% 0%, rgba(0, 0, 0, 0.18) 0%, transparent 65%),
                radial-gradient(ellipse 50% 65% at 100% 0%, rgba(0, 0, 0, 0.18) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 52px 28px 80px;
        }

        .brand-logo {
            display: block;
            width: clamp(20px, 82vw, 520px);
            height: auto;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.38));
        }

        .page {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 140px;
        }

        /* ── Botão de tema ── */
        .theme-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 200;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            color: var(--muted);
            transition: all .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
            padding: 6px;
            border-radius: 50%;
        }

        .theme-toggle:hover {
            border-color: var(--red);
            color: var(--text);
        }

        .theme-toggle .icon {
            font-size: 1rem;
            line-height: 1;
            transition: transform .3s;
            
        }

        :root.dark .theme-toggle .icon {
            transform: rotate(180deg);
        }

        .header {
            text-align: center;
            padding: 0;
            border-bottom: none;
            position: relative;
            background: var(--header-gradient);
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 24px;
            background: var(--red);
        }

        .logo-wrap {
            display: block;
            line-height: 0;
        }

        .logo-svg {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
        }

        .header-contact {
            margin-top: 0;
            padding: 10px 20px 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.66rem;
            letter-spacing: 0.07em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity .18s;
            cursor: pointer;
            white-space: nowrap;
            opacity: 0.8;
        }

        .contact-item:hover {
            opacity: 1;
        }

        .contact-item svg {
            width: 10px;
            height: 10px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        .cat-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            display: flex;
            padding: 0 20px;
            transition: background .3s;
        }

        .cat-btn {
            flex: 1;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            font-size: 0.65rem;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 14px 8px 13px;
            border-bottom: 1.5px solid transparent;
            transition: color .18s, border-color .18s;
        }

        .cat-btn.active {
            color: var(--text);
            border-bottom-color: var(--red);
        }

        .cat-btn:hover:not(.active) {
            color: var(--text);
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 32px 28px 16px;
        }

        .section-label h2 {
            font-size: 0.56rem;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: var(--red);
            font-weight: 400;
            white-space: nowrap;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .menu-hint {
            font-size: 0.48rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0.38;
            white-space: nowrap;
            flex-shrink: 0;
            padding-left: 6px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            border-bottom: 1px solid var(--border);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
            padding: 2px 0;
        }

        .item-left:active {
            opacity: .7;
        }

        .item-name {
            font-size: 0.93rem;
            font-weight: 300;
            color: var(--text);
            letter-spacing: .01em;
            flex: 1;
            min-width: 0;
            transition: color .15s;
        }

        .item-name::before {
            content: '·';
            color: var(--muted);
            opacity: 0.5;
            margin-right: 7px;
            font-size: 1rem;
            line-height: 1;
        }

        .item.in-cart .item-name::before {
            color: var(--red);
            opacity: 0.7;
        }

        .item.in-cart .item-name {
            color: var(--red);
        }

        .item-dots {
            flex: 1;
            border-bottom: 1px dotted var(--border);
            min-width: 12px;
            position: relative;
            top: -1px;
        }

        .item-price {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .item.premium .item-price {
            color: var(--red);
        }

        .item-qty {
            font-size: 0.68rem;
            color: var(--red);
            min-width: 20px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
        }

        .item-controls {
            display: none;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .item.in-cart .item-controls {
            display: flex;
        }

        .ctrl-btn {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--border);
            border-radius: 2px;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1;
            flex-shrink: 0;
            transition: border-color .15s, color .15s;
            font-family: 'DM Sans', sans-serif;
        }

        .ctrl-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 14px 24px 20px;
            z-index: 100;
            transition: transform .28s ease, opacity .28s ease;
        }

        .cart-bar.hidden {
            transform: translateX(-50%) translateY(110%);
            opacity: 0;
            pointer-events: none;
        }

        .cart-top {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .cart-info {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .cart-info strong {
            color: var(--text);
            font-weight: 400;
        }

        .cart-clear {
            display: none;
        }

        .delivery-toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .toggle-label {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--muted);
            white-space: nowrap;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 11px;
            transition: background .2s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background: var(--muted);
            border-radius: 50%;
            transition: transform .2s, background .2s;
        }

        .toggle-switch input:checked+.toggle-track {
            background: var(--red-dim);
        }

        .toggle-switch input:checked+.toggle-track::after {
            transform: translateX(18px);
            background: #fff;
        }

        .addr-wrap {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .26s ease, opacity .22s ease, margin .22s ease;
            margin-bottom: 0;
        }

        .addr-wrap.open {
            max-height: 52px;
            opacity: 1;
            margin-bottom: 10px;
        }

        .addr-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 300;
            padding: 9px 12px;
            outline: none;
            transition: border-color .18s;
        }

        .addr-input::placeholder {
            color: var(--muted);
        }

        .addr-input:focus {
            border-color: var(--red);
        }

        .cart-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }

        .send-btn {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 12px 0;
            transition: background .18s;
        }

        .send-btn:hover {
            background: var(--red-dim);
        }

        .send-btn svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .cat-nav {
            animation: fadeUp .6s .08s ease both;
        }

        .fade-in {
            animation: fadeUp .2s ease both;
        }

        .footer {
            text-align: center;
            padding: 44px 28px 28px;
            border-top: 1px solid var(--border);
        }

        .footer-line {
            width: 1px;
            height: 24px;
            background: var(--red);
            margin: 0 auto 18px;
        }

        .footer p {
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @media(max-width:480px) {
            .item {
                padding: 10px 18px;
            }

            .section-label {
                padding: 26px 18px 14px;
            }

            .header {
                padding: 30px 14px 20px;
            }

            .cart-bar {
                padding: 12px 16px 18px;
            }

            .cat-nav {
                padding: 0 6px;
            }

            .logo-svg {
                max-width: 290px;
            }
        }
    </style>
</head>

<body>

    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
        <span class="icon">☀️</span>
    </button>

    <div class="page">
        <header class="hero">
            <div class="hero-content">
                <img class="brand-logo" src="Assets/logo-banner-nbg.png" alt="Mary Pastelaria">
            </div>
        </header>

        <nav class="cat-nav">
            <button class="cat-btn active" onclick="selectCat('pasteis',this)">Pastéis</button>
            <button class="cat-btn" onclick="selectCat('salgados',this)">Salgados</button>
            <button class="cat-btn" onclick="selectCat('bebidas',this)">Bebidas</button>
        </nav>

        <main id="menu-wrap"></main>

        <footer class="footer">
            <div class="footer-line"></div>
            <p>selecione os itens e dê continuidade pelo whatsapp</p>
        </footer>
    </div>

    <div class="cart-bar hidden" id="cart-bar">

        <!-- Linha 1: total -->
        <div class="cart-top">
            <div class="cart-info" id="cart-info"></div>
        </div>

        <!-- Linha 2: botão + toggle lado a lado -->
        <div class="cart-actions">
            <button class="send-btn" onclick="handleSend()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12.004 0C5.373 0 0 5.373 0 12.004c0 2.114.554 4.1 1.522 5.827L0 24l6.351-1.498A11.957 11.957 0 0012.004 24C18.63 24 24 18.627 24 12.004 24 5.373 18.63 0 12.004 0zm0 21.818a9.812 9.812 0 01-5.001-1.368l-.36-.214-3.72.876.916-3.617-.235-.372a9.82 9.82 0 01-1.507-5.119c0-5.425 4.412-9.837 9.837-9.837 5.426 0 9.837 4.412 9.837 9.837S17.43 21.818 12.004 21.818z" />
                </svg>
                Continuar no WhatsApp
            </button>
            <label class="delivery-toggle-row">
                <span class="toggle-label">Entrega?</span>
                <span class="toggle-switch">
                    <input type="checkbox" id="delivery-toggle" onchange="onToggleDelivery(this.checked)">
                    <span class="toggle-track"></span>
                </span>
            </label>
        </div>

        <!-- Linha 3: endereço (aparece quando entrega ativo) -->
        <div class="addr-wrap" id="addr-wrap">
            <input class="addr-input" id="addr-input" type="text" placeholder="Rua, número, bairro…"
                autocomplete="street-address">
        </div>

    </div>



    <script>
        // ── TEMA ────────────────────────────────────────────────────────────
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');

            document.querySelector('.theme-toggle .icon').textContent = isDark ? '🌙' : '☀️';
        }
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
                document.addEventListener('DOMContentLoaded', function () {
                    const icon = document.querySelector('.theme-toggle .icon');
                    if (icon) icon.textContent = '🌙';
                });
            }
        })();



        // ── AUTO-RESET: cada nova sessão começa com carrinho limpo ──────────
        // WhatsApp sempre abre em nova aba/webview = sessão nova = pedido zerado
        (function () {
            if (!sessionStorage.getItem('session_active')) {
                sessionStorage.setItem('session_active', '1');
                // clear any persisted state (localStorage cart if ever stored)
                localStorage.removeItem('cart');
            }
            // Also reset if URL has ?reset or ?novo
            if (location.search.includes('reset') || location.search.includes('novo')) {
                sessionStorage.removeItem('session_active');
                location.replace(location.pathname);
            }
        })();

        const WA = '5515996026387';
        function copyAddress() {
            navigator.clipboard.writeText('Shigueru Yagui 23, Centro, Guapiara-SP').then(() => {
                const l = document.getElementById('addr-label'), o = l.textContent;
                l.textContent = 'Endereço copiado ✓'; setTimeout(() => l.textContent = o, 2000);
            });
        }
        const menu = {
            pasteis: {
                "Simples": [{ name: "Carne", price: 8 }, { name: "Queijo", price: 8 }, { name: "Frango", price: 8 }, { name: "Pizza", price: 8 }],
                "Combinados": [{ name: "Carne c/ Queijo", price: 10 }, { name: "Frango c/ Queijo", price: 10 }, { name: "Frango c/ Catupiry", price: 10 }, { name: "Calabresa c/ Queijo", price: 10 }, { name: "Portuguesa", price: 10 }],
                "Especiais": [{ name: "Costela", price: 15, premium: true }, { name: "Costela c/ Queijo", price: 15, premium: true }, { name: "Bacon", price: 15, premium: true }, { name: "X-Tudo", price: 15, premium: true }, { name: "Strogonoff de Frango", price: 15, premium: true }, { name: "Carne Seca", price: 15, premium: true }, { name: "Pernil", price: 15, premium: true }, { name: "Palmito", price: 15, premium: true }],
                "Doces": [{ name: "Brigadeiro", price: 12 }, { name: "Prestígio", price: 12 }, { name: "Doce de Leite", price: 12 }, { name: "Brigadeiro c/ Morango", price: 12 }, { name: "Banana c/ Canela", price: 12 }, { name: "Nutella", price: 15, premium: true }, { name: "Romeu e Julieta", price: 12 }]
            },
            salgados: { "Salgados": [{ name: "Coxinha de Frango", price: 7 }, { name: "Coxinha de Costela", price: 9, premium: true }, { name: "Risoles de Presunto/Queijo", price: 7 }, { name: "Risoles de Carne", price: 7 }, { name: "Bolinha de Queijo", price: 8 }, { name: "Kibe", price: 7 }, { name: "Kibe c/ Requeijão", price: 8 }, { name: "Esfiha de Carne", price: 6 }, { name: "Esfiha de Frango", price: 6 }, { name: "Enroladinho de Salsicha", price: 6 }, { name: "Folhado de Calabresa", price: 8 }, { name: "Pão de Queijo", price: 4 }, { name: "Croquete de Carne", price: 6 }] },
            bebidas: { "Bebidas": [{ name: "Refrigerante Lata", price: 6 }, { name: "Refrigerante 600ml", price: 9 }, { name: "Água sem Gás", price: 4 }, { name: "Água com Gás", price: 5 }, { name: "Suco Natural Laranja", price: 9 }, { name: "Suco Natural Maracujá", price: 9 }, { name: "Suco Natural Limão", price: 8 }, { name: "Café Expresso", price: 5 }, { name: "Café com Leite", price: 6 }, { name: "Cappuccino", price: 8 }, { name: "Chá Gelado", price: 7 }, { name: "Caldo de Cana", price: 6 }, { name: "Água de Coco", price: 7 }] }
        };
        const cart = new Map(); let wantsDelivery = false;
        const fmt = n => 'R$ ' + n.toFixed(2).replace('.', ',');
        const toId = s => s.replace(/[^a-z0-9]/gi, '_');
        function renderMenu(cat) {
            const wrap = document.getElementById('menu-wrap'); let html = '';
            let isFirst = true;
            Object.entries(menu[cat]).forEach(([sec, items]) => {
                if (isFirst) { html += `<div class="section-label"><h2>${sec}</h2><span class="menu-hint">toque para selecionar</span></div>`; isFirst = false; } else { html += `<div class="section-label"><h2>${sec}</h2></div>`; }
                items.forEach(item => {
                    const id = toId(item.name), qty = cart.has(id) ? cart.get(id).qty : 0;
                    html += `<div class="item${qty > 0 ? ' in-cart' : ''}${item.premium ? ' premium' : ''} fade-in" id="row-${id}">
        <div class="item-left" onclick="tap('${id}','${item.name.replace(/'/g, "\\'")}',${item.price})">
          <span class="item-name">${item.name}</span>
          <span class="item-qty" id="qty-${id}">${qty > 0 ? '×' + qty : ''}</span>
          <span class="item-dots"></span>
          <span class="item-price">${fmt(item.price)}</span>
        </div>
        <div class="item-controls">
          <button class="ctrl-btn" onclick="dec('${id}')">−</button>
          <button class="ctrl-btn" onclick="inc('${id}','${item.name.replace(/'/g, "\\'")}',${item.price})">+</button>
        </div>
      </div>`;
                });
            });
            wrap.innerHTML = html;
        }
        function tap(id, n, p) { cart.has(id) ? cart.get(id).qty++ : cart.set(id, { name: n, price: p, qty: 1 }); sync(id); }
        function inc(id, n, p) { cart.has(id) ? cart.get(id).qty++ : cart.set(id, { name: n, price: p, qty: 1 }); sync(id); }
        function dec(id) { if (!cart.has(id)) return; const e = cart.get(id); e.qty--; if (e.qty <= 0) cart.delete(id); sync(id); }
        function sync(id) {
            const qty = cart.has(id) ? cart.get(id).qty : 0;
            const row = document.getElementById('row-' + id), badge = document.getElementById('qty-' + id);
            if (badge) badge.textContent = qty > 0 ? '×' + qty : '';
            if (row) row.classList.toggle('in-cart', qty > 0);
            refreshBar();
        }
        function refreshBar() {
            const bar = document.getElementById('cart-bar');
            if (!cart.size) { bar.classList.add('hidden'); document.getElementById('delivery-toggle').checked = false; wantsDelivery = false; document.getElementById('addr-wrap').classList.remove('open'); document.getElementById('addr-input').value = ''; return; }
            bar.classList.remove('hidden'); let total = 0, count = 0;
            cart.forEach(e => { total += e.price * e.qty; count += e.qty; });
            document.getElementById('cart-info').innerHTML = `<strong>${count} ${count === 1 ? 'item' : 'itens'}</strong> &middot; ${fmt(total)}`;
        }
        function clearCart() {
            cart.clear();
            document.querySelectorAll('.item.in-cart').forEach(r => { r.classList.remove('in-cart'); const b = document.getElementById('qty-' + r.id.replace('row-', '')); if (b) b.textContent = ''; });
            refreshBar();
        }
        function onToggleDelivery(v) { wantsDelivery = v; document.getElementById('addr-wrap').classList.toggle('open', v); if (v) setTimeout(() => document.getElementById('addr-input').focus(), 260); }
        function handleSend() {
            if (!cart.size) return;
            if (wantsDelivery) { const a = document.getElementById('addr-input').value.trim(); if (!a) { document.getElementById('addr-input').focus(); return; } }
            let lines = ['🥟 *Pedido — Mary Pastelaria*', '']; let total = 0;
            cart.forEach(e => { const s = e.price * e.qty; total += s; lines.push(`• ${e.qty}x ${e.name} — ${fmt(s)}`); });
            lines.push('', `*Total: ${fmt(total)}*`, '');
            lines.push(wantsDelivery ? `📍 *Entrega:* ${document.getElementById('addr-input').value.trim()}` : '🏠 *Retirada no local*');
            window.open(`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
        }
        function selectCat(cat, btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderMenu(cat); }
        renderMenu('pasteis');

    </script>
</body>
